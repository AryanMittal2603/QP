/* ── Design tokens ── */
:root{
  --page:#DCE3E1; --paper:#F3F6F4; --sky:#DCECF2; --ink:#142844; --ink2:#1F3A63; --quiet:#637383; --rule:#A8BBC2;
  --line:rgba(20,40,68,.13); --line2:rgba(20,40,68,.24);
  --accent:#B76A3B; --green:#2E7567; --amber:#C9962B; --blue:#2557DA;
  --card:rgba(255,255,255,.9);
  --ok:#2E7567; --okbg:#E1EFEB; --warn:#94620E; --warnbg:#F6EDD9; --bad:#A63D2A; --badbg:#F6E3DD; --info:#2557DA; --infobg:#E3EAFB;
  --sans:Archivo,"Segoe UI",system-ui,-apple-system,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --navy:var(--ink); --navy2:var(--ink2); --gold:var(--amber); --muted:var(--quiet);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;position:relative;isolation:isolate;
  background:radial-gradient(ellipse at 22% 16%,#FFFFFF 0%,#F7F8F5 30%,transparent 58%),linear-gradient(124deg,var(--paper) 0 63%,#E8F1F3 63% 100%) fixed}
body::before{content:"";position:fixed;inset:-18%;z-index:-1;pointer-events:none;opacity:.8;
  background:radial-gradient(circle at 79% 30%,#B8D9E4 0 8%,transparent 26%),radial-gradient(circle at 88% 78%,#D9BFAF 0 6%,transparent 24%);filter:blur(56px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;box-shadow:inset 0 0 140px 10px rgba(20,40,68,.06)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(183,106,59,.22)}
[hidden]{display:none!important}

/* ── Header: seal, mono kicker, heavy title, hairline rule ── */
header{position:relative;max-width:1320px;margin:0 auto;padding:20px 32px 18px;display:flex;align-items:center;gap:18px}
header::after{content:"";position:absolute;left:32px;right:32px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(20,40,68,.3),rgba(20,40,68,.05))}
.logo{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--ink);font:600 10.5px var(--mono);letter-spacing:.08em;
  border:1.5px solid var(--ink);box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(20,40,68,.12),0 10px 24px -14px rgba(20,40,68,.5)}
.logo img{width:100%;height:100%;object-fit:contain}
.htitle{flex:1;min-width:0}
.htitle .t1{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--quiet)}
.htitle .t2{font-weight:800;font-size:23px;letter-spacing:-.025em;line-height:1.15;margin-top:4px}
.htitle .t2 em{font-style:normal;color:var(--green)}
.hmeta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}
.hmeta .clock{font:600 13px var(--mono);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#who{font-size:12.5px;color:var(--quiet)}#who:empty{display:none}#who b{color:var(--ink);font-weight:700}
.net{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:4px;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.net::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.net.off{background:var(--okbg);color:var(--ok)}.net.on{background:var(--badbg);color:var(--bad)}
#banners{max-width:1320px;margin:0 auto;padding:0 32px}
#banners .banner{margin-top:14px;padding:11px 16px;border-radius:6px;font-weight:600;font-size:13.5px;border-left:3px solid currentColor}
.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}
main{max-width:1320px;margin:0 auto;padding:28px 32px 56px}
.foot{max-width:1320px;margin:0 auto;padding:16px 32px 26px;display:flex;justify-content:space-between;gap:12px;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);position:relative}
.foot::before{content:"";position:absolute;left:32px;right:32px;top:0;height:1px;background:linear-gradient(90deg,rgba(20,40,68,.18),rgba(20,40,68,.03))}

/* ── Type ── */
h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.012em;line-height:1.2}
h4{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
h2 em,h3 em,h1 em{font-style:normal;color:var(--green)}
.muted{color:var(--quiet)}.sm{font-size:12.5px}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.eyebrow::before{content:"";width:24px;height:2px;background:currentColor;flex:none}
.head .eyebrow::before,.auth>.eyebrow::before,.hero .eyebrow::before{width:48px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.head{min-width:0}

/* ── Surfaces ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(20,40,68,.03),0 16px 34px -26px rgba(20,40,68,.4)}
.card.click{cursor:pointer;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.card.click:hover{border-color:rgba(20,40,68,.42);box-shadow:0 22px 40px -24px rgba(20,40,68,.5);transform:translateY(-2px)}
.card.callout{border:1px solid rgba(201,150,43,.55);border-top:3px solid var(--amber);background:linear-gradient(180deg,#FBF6EA,rgba(255,255,255,.92))}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.grid-cards .card{margin:0;border-top:3px solid var(--ink)}
.row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:200px}
.toolbar{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.toolbar>.btn,.toolbar>.badge{margin-bottom:2px}
.sp{flex:1}
.empty{padding:52px 24px;text-align:center;color:var(--quiet);border:1px dashed var(--rule);border-radius:10px;background:rgba(255,255,255,.5)}

/* stat blocks: heavy rule, big number, quiet label */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:26px;margin:2px 0 26px}
.stat{border-top:2px solid var(--ink);padding-top:12px}
.stat .v{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1}
.stat .v small{font-size:16px;font-weight:800;margin-left:4px;letter-spacing:-.01em}
.stat .l{font-size:13px;color:var(--quiet);margin-top:7px;line-height:1.35}
.stat.amber{border-top-color:var(--amber)}.stat.amber .v{color:#8A6214}
.stat.green{border-top-color:var(--green)}.stat.green .v{color:var(--green)}
.stat.rust{border-top-color:var(--accent)}.stat.rust .v{color:var(--accent)}
.stat.blue{border-top-color:var(--blue)}.stat.blue .v{color:var(--blue)}

/* ── Controls ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:8px 15px;border-radius:6px;cursor:pointer;
  font-weight:700;font-size:13.5px;letter-spacing:-.005em;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn:hover{border-color:rgba(20,40,68,.55)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.linkbtn:focus-visible,.card.click:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.gold{background:var(--amber);border-color:#A97C1E;color:#1B1405}.btn.gold:hover{background:#D5A63F}
.btn.danger{color:var(--bad);border-color:rgba(166,61,42,.35);background:#fff}.btn.danger:hover{background:var(--badbg);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--quiet)}.btn.ghost:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.6)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.tabs{display:flex;gap:26px;margin-bottom:28px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{position:relative;border:0;background:transparent;padding:13px 0 12px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--quiet);cursor:pointer;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.tabs .btn,.tabs>span{margin-left:-12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font:600 10px/1.35 var(--mono);letter-spacing:.11em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.b-open{background:var(--okbg);color:var(--ok)}.b-up{background:var(--infobg);color:var(--info)}.b-closed{background:#E6EBEE;color:#4E5D6C}
.b-lock{background:var(--ink);color:#fff}.b-prog{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.linkbtn{border:0;background:none;color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;padding:3px 0;border-bottom:1.5px solid rgba(183,106,59,.55);transition:color .15s,border-color .15s}
.linkbtn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.linkbtn:disabled{border-bottom-color:transparent;cursor:default}

/* ── Tables ── */
table.tbl{width:100%;border-collapse:collapse;margin-top:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:middle}
.tbl th{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--quiet);border-bottom:1.5px solid var(--ink);background:transparent;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(220,236,242,.32)}
.card>.tbl:first-child th{padding-top:14px}
.log-table td{font-size:12.5px}
.log-table td.det{max-width:560px;word-break:break-word;color:#33475B}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw-mini{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border:1px solid var(--line2);border-radius:999px;font-size:12px;font-weight:600;background:#fff}
.sw-mini i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}

/* ── Randomization grid ── */
.rgrid-wrap{overflow-x:auto;border-radius:10px}
table.rgrid{width:100%;border-collapse:separate;border-spacing:0;min-width:980px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 16px 34px -26px rgba(20,40,68,.4)}
.rgrid th{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--quiet);padding:15px 10px 13px;text-align:center;border-bottom:1.5px solid var(--ink);background:transparent}
.rgrid th:first-child{text-align:left;padding-left:20px}
.rgrid th.final{color:#8A6214;background:linear-gradient(180deg,#F6EDD9,rgba(246,237,217,.2));box-shadow:inset 0 3px 0 var(--amber)}
.rgrid td{border-top:1px solid var(--line);padding:13px 10px;text-align:center;vertical-align:middle}
.rgrid tbody tr:first-child td{border-top:0}
.rgrid td.subj{text-align:left;min-width:230px;padding-left:20px}
.rgrid td.subj b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.rgrid td.final{background:rgba(246,237,217,.42)}
.cell.pending{color:var(--rule)}
.chip{display:inline-flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border-radius:8px;border:1px solid var(--line2);background:#fff;text-align:left}
.chip .sw{width:26px;height:26px;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.chip b{display:block;font-size:13px;font-weight:800}
.chip svg{width:13px;height:13px;color:var(--quiet)}
td.final .chip{border:1.5px solid var(--amber);box-shadow:0 0 0 3px rgba(201,150,43,.18)}
.ts{font:500 10.5px var(--mono);color:var(--quiet);margin-top:5px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.notice{padding:11px 16px;border-radius:6px;margin-bottom:18px;font-weight:600;font-size:13.5px;border-left:3px solid currentColor}
.notice.ok{background:var(--okbg);color:var(--ok)}.notice.info{background:var(--infobg);color:var(--info)}.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.lock{background:var(--ink);color:#fff;border-left-color:var(--amber)}
.notice ul{margin:6px 0 0;padding-left:18px;font-weight:500}

/* ── Forms & modals ── */
.overlay{position:fixed;inset:0;background:rgba(20,40,68,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.modal{background:#FBFCFB;border:1px solid var(--line);border-radius:12px;padding:26px 28px;width:min(500px,100%);max-height:92vh;overflow:auto;
  box-shadow:0 36px 90px -24px rgba(20,40,68,.5);animation:rise .45s var(--ease)}
.modal.wide{width:min(740px,100%)}
.modal>h3{font-size:21px;letter-spacing:-.02em}
.form{display:flex;flex-direction:column;gap:15px;margin-top:16px}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>span{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--quiet)}
.fld>span.hint{font:400 12px/1.45 var(--sans);letter-spacing:0;text-transform:none}
.fld input,.fld select,.fld textarea,.crow input[type=text]{padding:10px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
.fld input::placeholder,.crow input::placeholder{color:#9AA7B4}
.fld input:focus,.fld select:focus,.fld textarea:focus,.crow input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(37,87,218,.14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.err{background:var(--badbg);color:var(--bad);padding:10px 13px;border-radius:6px;font-weight:600;font-size:13px;border-left:3px solid currentColor}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.presets button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 11px 4px 5px;cursor:pointer;font-size:12.5px;font-weight:600;transition:border-color .15s}
.presets button:hover{border-color:var(--ink)}
.presets button i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.crow{display:grid;grid-template-columns:46px 1fr 40px;gap:8px;align-items:center;margin-bottom:7px}
.crow.muted{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;margin-bottom:4px}
.crow input[type=color]{width:46px;height:42px;padding:3px;border:1px solid var(--line2);border-radius:6px;background:#fff;cursor:pointer}
.crow button{border:1px solid rgba(166,61,42,.35);color:var(--bad);background:#fff;border-radius:6px;height:42px;cursor:pointer}
.crow button:hover{background:var(--badbg)}
.auth{max-width:470px;margin:52px auto;padding:30px 32px 28px;animation:rise .6s var(--ease)}
.auth h3{font-size:27px;letter-spacing:-.03em;margin:4px 0 8px}
.auth .notice{margin:14px 0 4px}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:15px;border-top:1px solid var(--line)}

/* ── Approver ── */
.req{border-left:3px solid var(--rule)}.req.pending{border-left-color:var(--amber)}.req.approved{border-left-color:var(--green)}.req.rejected,.req.disabled{border-left-color:var(--bad)}
.req h3{font-size:19px;letter-spacing:-.02em}
.req details{margin-top:12px}
.req summary{cursor:pointer;font:600 10.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.attempt{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-top:10px;background:rgba(243,246,244,.75)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:5px 14px;font-size:12.5px;margin:9px 0 0}
.kv dt{font:600 9.5px/1.95 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--quiet)}.kv dd{margin:0;word-break:break-word}

/* ── Landing ── */
.hero{max-width:1180px;margin:18px auto 30px;animation:rise .7s var(--ease)}
.hero h1{margin:0;font-size:50px;line-height:1.03;font-weight:800;letter-spacing:-.04em;max-width:920px}
.hero p{max-width:660px;font-size:16.5px;line-height:1.5;color:var(--quiet);margin:16px 0 0}
.mode-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1180px;margin:0 auto 30px}
.mode-cards .card{margin:0;padding:24px 24px 22px;border-top:3px solid var(--k);display:flex;flex-direction:column;gap:9px;animation:rise .7s var(--ease) both}
.mode-cards .card:nth-child(2){animation-delay:.07s}.mode-cards .card:nth-child(3){animation-delay:.14s}
.mode-cards .num{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--k)}
.mode-cards h3{font-size:23px;letter-spacing:-.025em;margin:0}
.mode-cards p{margin:0;flex:1;color:var(--quiet)}
.mode-cards .btn{align-self:flex-start;margin-top:8px}
.journey-label{max-width:1180px;margin:0 auto 12px}
.journey{max-width:1180px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.step{position:relative;height:66px;padding:0 18px 0 30px;display:flex;align-items:center;gap:10px;color:#fff;background:var(--c);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);animation:rise .7s var(--ease) both}
.step:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:16px}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff;color:var(--c);flex:none}
.step b{display:block;font-size:14px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.step small{display:block;font:600 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;opacity:.85;margin-top:4px}
.landing-note{max-width:1180px;margin:0 auto;color:var(--quiet);font-size:13px}

/* ── Toast ── */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px 11px 16px;border-radius:6px;z-index:90;font-weight:600;font-size:13.5px;
  box-shadow:0 18px 40px -12px rgba(20,40,68,.55);border-left:3px solid var(--accent);animation:toastIn .4s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* ── Dice ── */
.roll-modal{text-align:center}
.roll-modal .eyebrow{justify-content:center}
.roll-modal h3{font-size:22px;letter-spacing:-.02em}
.stage{height:250px;display:flex;align-items:flex-end;justify-content:center;perspective:800px;position:relative;margin:6px 0}
.hop{margin-bottom:46px;transform-style:preserve-3d}
.hop.go{animation:hop 3s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes hop{0%{transform:translateY(-150px)}22%{transform:translateY(0)}38%{transform:translateY(-70px)}54%{transform:translateY(0)}67%{transform:translateY(-26px)}78%{transform:translateY(0)}87%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.dshadow{position:absolute;bottom:26px;left:50%;width:120px;height:18px;margin-left:-60px;border-radius:50%;background:radial-gradient(rgba(20,40,68,.35),transparent 70%)}
.dice{width:120px;height:120px;position:relative;transform-style:preserve-3d;transition:transform 3s cubic-bezier(.15,.65,.2,1)}
.face{position:absolute;inset:0;border-radius:20px;background:var(--c);border:3px solid rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-shadow:inset 0 0 22px rgba(0,0,0,.22),inset 0 6px 10px rgba(255,255,255,.35)}
.face i{display:block;margin:auto;width:17px;height:17px;border-radius:50%}
.face i.p{background:var(--ink);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.f1{transform:translateZ(60px)}.f2{transform:rotateY(180deg) translateZ(60px)}.f3{transform:rotateY(90deg) translateZ(60px)}
.f4{transform:rotateY(-90deg) translateZ(60px)}.f5{transform:rotateX(90deg) translateZ(60px)}.f6{transform:rotateX(-90deg) translateZ(60px)}
.prism{width:170px;height:184px;position:relative;transform-style:preserve-3d;transition:transform 3s cubic-bezier(.15,.65,.2,1)}
.pface{position:absolute;left:0;top:50%;width:170px;height:var(--h);margin-top:calc(var(--h) / -2);background:var(--c);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border:2px solid rgba(0,0,0,.2);border-radius:6px;box-shadow:inset 0 0 18px rgba(0,0,0,.22),inset 0 4px 8px rgba(255,255,255,.3);overflow:hidden}
.dshadow.wide{width:190px;margin-left:-95px}
.rstatus{font:600 11px var(--mono);color:var(--quiet);letter-spacing:.22em;min-height:22px;margin-top:4px}
.rstatus.rolling::after{content:"";animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.result{display:flex;align-items:center;gap:16px;justify-content:center;margin:10px auto 6px;padding:14px 20px;border-radius:10px;border:2px solid var(--c);background:#fff;max-width:440px;animation:glow 1.6s ease-in-out infinite;text-align:left}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 28px 8px color-mix(in srgb,var(--c) 45%,transparent)}}
.result .bsw{width:58px;height:58px;border-radius:10px;background:var(--c);border:2px solid rgba(0,0,0,.18);flex:none}
.result .rname{font-size:30px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
.result .muted.sm:first-child{font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase}
.result.final{border-color:var(--amber);background:#FBF5E8}
.finalbanner{font:600 11px var(--mono);color:var(--accent);letter-spacing:.24em;margin-top:6px}
.lockline{font:500 11px var(--mono);color:var(--green);letter-spacing:.03em;margin:10px 0 14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}

@media (max-width:980px){.mode-cards{grid-template-columns:1fr}.journey{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:38px}}
@media (max-width:720px){
  .two,.three{grid-template-columns:1fr}
  header{flex-wrap:wrap;padding:14px 16px}header::after{left:16px;right:16px}.htitle .t2{font-size:19px}
  .hmeta{align-items:flex-start;text-align:left;width:100%}.hrow{justify-content:flex-start}
  main{padding:20px 16px 44px}#banners{padding:0 16px}.foot{padding:14px 16px 22px}.foot::before{left:16px;right:16px}
  .journey{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}.hero h1{font-size:32px}h2{font-size:25px}
  .auth{margin:24px auto;padding:24px 20px}.tabs{gap:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
@media print{header,.tabs,.toolbar,.btn,.foot{display:none!important}body{background:#fff}body::before,body::after{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">UPESSC</div>
  <div class="htitle">
    <div class="t1">Uttar Pradesh Education Service Selection Commission</div>
    <div class="t2">Question Paper <em>Randomization</em></div>
  </div>

'use strict';
/* =========================================================

const enc = new TextEncoder();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const uid = () => hex(crypto.getRandomValues(new Uint8Array(8)));

function fmtTs(t) { if (!t) return '—'; const d = new Date(t); return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const fmtTime = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtDate = s => { const [y, m, d] = s.split('-'); return `${d}-${m}-${y}`; };
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };

const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* ---------- Server API (Vercel + Neon). Unavailable when opened as a local file or offline. ---------- */
const HAS_SERVER = location.protocol.startsWith('http');
async function api(path, { method = 'GET', body, token } = {}) {

  catch { const e = new Error('Server not reachable. Check the internet connection.'); e.network = true; throw e; }
  const j = await r.json().catch(() => ({ error: 'Unexpected server response.' }));

    }

}

/* =========================================================
   IndexedDB storage
   ========================================================= */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('upessc_qpr_v1', 2);
    r.onupgradeneeded = ev => {
      const d = r.result;
      if (ev.oldVersion < 1) {
        d.createObjectStore('meta');
        d.createObjectStore('admin_exams', { keyPath: 'id' });
        d.createObjectStore('admin_log', { keyPath: 'seq' });
        d.createObjectStore('client_exams', { keyPath: 'id' });
        d.createObjectStore('draws', { keyPath: 'key' });
        d.createObjectStore('client_log', { keyPath: 'seq' });
      }
      if (ev.oldVersion < 2) d.createObjectStore('choices', { keyPath: 'examId' });   // locked final-iteration choice per exam
    };
    r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); res(d); }; r.onerror = () => rej(r.error);
  });
}
function reqP(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idb = {
  get: (st, k) => reqP(st, 'readonly', s => s.get(k)),
  all: st => reqP(st, 'readonly', s => s.getAll()),
  put: (st, v, k) => reqP(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)),
  del: (st, k) => reqP(st, 'readwrite', s => s.delete(k)),
};
function lastEntry(store) {

}

/* =========================================================
   Hash-chained audit log
   Each entry: hash = SHA-256( stable-JSON(entry without "hash") ), prevHash links to previous entry.
   ========================================================= */
let logQueue = Promise.resolve();
function appendLog(scope, event, details = {}, opts = {}) {
  const run = async () => {
    const store = scope + '_log';
    const last = await lastEntry(store);
    const now = Date.now();
    const entry = {
      seq: last ? last.seq + 1 : 1, ts: now, time: new Date(now).toISOString(), localTime: fmtTs(now),
      actor: opts.actor || (session && session.user) || 'system', console: scope, event,
      details: JSON.parse(JSON.stringify(details)), prevHash: last ? last.hash : 'GENESIS'
    };
    entry.hash = await sha256(stable(entry));
    const extra = opts.extra ? opts.extra(entry) : null;
    await new Promise((res, rej) => {
      const stores = [store, 'meta']; if (extra) stores.push(extra.store);
      const t = db.transaction(stores, 'readwrite');
      t.objectStore(store).add(entry);
      t.objectStore('meta').put({ seq: entry.seq, hash: entry.hash }, scope + '_head');
      if (extra) t.objectStore(extra.store).add(extra.value);   // add() refuses to overwrite → immutability
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction aborted'));
    });
    return entry;
  };
  const p = logQueue.then(run); logQueue = p.catch(() => {}); return p;
}
async function verifyEntries(entries) {
  const issues = []; let prev = 'GENESIS';
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.seq !== i + 1) issues.push(`Sequence gap at entry #${e.seq}`);
    if (e.prevHash !== prev) issues.push(`Broken chain link at entry #${e.seq}`);
    const { hash, ...rest } = e;
    if (await sha256(stable(rest)) !== hash) issues.push(`Entry #${e.seq} has been altered`);
    prev = hash;
  }
  return { ok: !issues.length, issues, count: entries.length, head: prev };
}
async function verifyChain(scope) {
  const entries = (await idb.all(scope + '_log')).sort((a, b) => a.seq - b.seq);
  const base = await verifyEntries(entries), issues = base.issues, prev = base.head;
  const head = await idb.get('meta', scope + '_head');
  const last = entries[entries.length - 1];
  if (head && (!last || head.seq !== last.seq || head.hash !== last.hash)) issues.push('Latest log entries are missing (chain head mismatch)');

    }
    const keys = new Set(draws.map(d => d.key));

    }

/* PC clock is the source of truth; flag any backwards movement */
async function checkClock(context, scope = 'client') {
  const now = Date.now(); const key = scope + '_clock';
  const m = (await idb.get('meta', key)) || { lastSeen: 0, flags: 0 };
  let flagged = false;
  if (m.lastSeen && now < m.lastSeen - 2000) {
    flagged = true; m.flags = (m.flags || 0) + 1;
    await appendLog(scope, 'CLOCK_BACKWARDS_FLAG', { context, currentClock: new Date(now).toISOString(), currentLocal: fmtTs(now), lastSeenClock: new Date(m.lastSeen).toISOString(), lastSeenLocal: fmtTs(m.lastSeen), backwardsBySeconds: Math.round((m.lastSeen - now) / 1000) });
  }
  m.lastSeen = Math.max(now, m.lastSeen || 0);
  await idb.put('meta', m, key);
  if (flagged) renderBanners();
  return flagged;
}

  $('#clock').textContent = fmtTs(Date.now());

  syncNetUi();
}
setInterval(tickClock, 1000);

});

  }
}, 20000);

async function renderHeader() {

  if (session && session.role === 'admin' && HAS_SERVER) api('admin/settings').then(async r => { if (r.logo !== logoData) { r.logo ? await idb.put('meta', r.logo, 'admin_logo') : await idb.del('meta', 'admin_logo'); if (r.logo !== logoData) renderHeader(); } }).catch(() => {});

/* =========================================================

function openModal(html, { wide = false, dismissable = true, onDismiss, onMount } = {}) {
  const wrap = document.createElement('div'); wrap.className = 'overlay';
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  $('#modalRoot').appendChild(wrap);
  const close = () => wrap.remove();
  if (dismissable) wrap.addEventListener('mousedown', e => { if (e.target === wrap) { close(); onDismiss && onDismiss(); } });
  onMount && onMount(wrap.firstElementChild, close);
  return close;
}

    { onDismiss: r, onMount: (m, close) => { m.querySelector('[data-ok]').onclick = () => { close(); r(); }; } }));
}

    { onDismiss: () => r(false), onMount: (m, close) => { m.querySelector('[data-no]').onclick = () => { close(); r(false); }; m.querySelector('[data-ok]').onclick = () => { close(); r(true); }; } }));
}
function fieldHtml(f) {
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  if (f.type === 'colours') return `<div class="fld"><span>${esc(f.label)}</span>${hint}<div data-colours="${f.name}"></div></div>`;
  if (f.type === 'select') return `<label class="fld"><span>${esc(f.label)}</span><select name="${f.name}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === (f.value || f.options[0][0]) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${hint}</label>`;
  if (f.type === 'textarea') return `<label class="fld"><span>${esc(f.label)}</span><textarea name="${f.name}" rows="2">${esc(f.value || '')}</textarea>${hint}</label>`;
  return `<label class="fld"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type || 'text'}" ${f.accept ? `accept="${f.accept}"` : ''} value="${f.type === 'file' ? '' : esc(f.value || '')}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off">${hint}</label>`;
}
function formModal(title, fields, { submitLabel = 'Save', validate, intro = '' } = {}) {
  return new Promise(resolve => {
    const groups = []; // allow {row:[...]} to place fields side by side
    const html = `<h3>${esc(title)}</h3>${intro}<form class="form" novalidate>${fields.map(f => f.row ? `<div class="${f.row.length === 3 ? 'three' : 'two'}">${f.row.map(fieldHtml).join('')}</div>` : fieldHtml(f)).join('')}
      <div class="err" hidden></div><div class="actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary" type="submit">${esc(submitLabel)}</button></div></form>`;
    const flat = fields.flatMap(f => f.row || [f]);
    openModal(html, {
      wide: flat.some(f => f.type === 'colours'), onDismiss: () => resolve(null),
      onMount: (m, close) => {
        const form = m.querySelector('form'), errEl = m.querySelector('.err');
        flat.filter(f => f.type === 'colours').forEach(f => mountColours(m.querySelector(`[data-colours="${f.name}"]`), f.value || []));
        m.querySelector('[data-cancel]').onclick = () => { close(); resolve(null); };
        const first = form.querySelector('input,textarea'); first && first.focus();
        form.onsubmit = async e => {
          e.preventDefault(); errEl.hidden = true;
          const vals = {};
          for (const f of flat) {
            if (f.type === 'colours') vals[f.name] = readColours(m.querySelector(`[data-colours="${f.name}"]`));
            else if (f.type === 'file') vals[f.name] = form.elements[f.name].files[0] || null;
            else vals[f.name] = form.elements[f.name].value.trim();
            if (f.required && !vals[f.name]) { errEl.textContent = `${f.label} is required.`; errEl.hidden = false; return; }
          }
          const btn = form.querySelector('[type=submit]'); btn.disabled = true;
          try { const msg = validate ? await validate(vals) : null; if (msg) { errEl.textContent = msg; errEl.hidden = false; btn.disabled = false; return; } }
          catch (err) { errEl.textContent = err.message; errEl.hidden = false; btn.disabled = false; return; }
          close(); resolve(vals);
        };
      }
    });
  });
}
function mountColours(el, initial) {

      ${rows.length ? `<div class="crow muted sm"><span>Colour</span><span>Colour name</span><span></span></div>` : '<div class="muted sm">Click a preset colour above to add question paper colours.</div>'}
      ${rows.map((r, i) => `<div class="crow"><input type="color" value="${r.hex}"><input type="text" data-n value="${esc(r.name)}" placeholder="e.g. Red"><button type="button" data-rm="${i}" title="Remove">✕</button></div>`).join('')}`;

/* =========================================================
   ACCOUNTS — mobile number + password, verified by OTP, approved by the Approver
   ========================================================= */
const ROLE_NAME = { admin: 'Admin', randomizer: 'Randomizer', approver: 'Approver' };
const CONSOLE_NAME = { admin: 'Admin Console', randomizer: 'Randomization Console', approver: 'Approver Console' };
/* Indian mobile number → 10 digits (accepts +91 / 0 prefixes, spaces, dashes); null if invalid. Same rule as the server. */
function normMobile(v) {
  let d = String(v ?? '').replace(/[\s\-()]/g, '');
  if (!/^\+?\d+$/.test(d)) return null;
  d = d.replace(/^\+/, '');
  if (d.length === 12 && d.startsWith('91')) d = d.slice(2); else if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
const utcOffsetText = () => { const m = -new Date().getTimezoneOffset(); return `UTC${m >= 0 ? '+' : '-'}${pad(Math.floor(Math.abs(m) / 60))}:${pad(Math.abs(m) % 60)}`; };
const showErr = (el, msg) => { el.textContent = msg; el.hidden = false; };
/* What this browser can say about itself; the server adds IP address and location. Shown to the approver. */
async function deviceInfo(consoleName) {
  const ua = navigator.userAgentData, c = navigator.connection || {};
  let hi = {}; try { if (ua && ua.getHighEntropyValues) hi = await ua.getHighEntropyValues(['platformVersion', 'model', 'fullVersionList']); } catch {}
  const brands = (hi.fullVersionList || (ua && ua.brands) || []).filter(b => !/not.?a.?brand/i.test(b.brand)).map(b => `${b.brand} ${b.version}`);
  return { appVersion: APP_VERSION, console: consoleName, installId: db ? await installId() : null,
    browser: brands.join(', ') || null, os: [(ua && ua.platform) || navigator.platform, hi.platformVersion].filter(Boolean).join(' ') || null, deviceModel: hi.model || null,
    mobileDevice: ua ? !!ua.mobile : /Mobi|Android/i.test(navigator.userAgent), userAgent: navigator.userAgent,
    screen: `${screen.width}×${screen.height} @${devicePixelRatio}x`, window: `${innerWidth}×${innerHeight}`, cpuCores: navigator.hardwareConcurrency || null, memoryGB: navigator.deviceMemory || null,
    language: navigator.language, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null, utcOffset: utcOffsetText(), clientTime: new Date().toISOString(), clientTimeMs: Date.now(),
    online: navigator.onLine, networkType: c.type || null, effectiveType: c.effectiveType || null, downlinkMbps: c.downlink ?? null, rttMs: c.rtt ?? null, saveData: c.saveData ?? null };
}
function loginCard({ role, title, intro = '', idLabel, prefill = '', links = '' }) {
  return `<div class="auth card"><div class="eyebrow">${CONSOLE_NAME[role]}</div><h3>${title}</h3>${intro}
    <form class="form" id="lf" novalidate><label class="fld"><span>${idLabel}</span><input name="u" autocomplete="username" value="${esc(prefill)}"></label><label class="fld"><span>Password</span><input name="p" type="password" autocomplete="current-password"></label><div class="err" hidden></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="back">Back</button><button class="btn primary">Log in</button></div></form>${links}</div>`;
}
/* Both variants are rendered; syncNetUi() shows the right one and keeps it right when the network comes and goes */
const accountLinks = (canSignup = true) => `<div class="auth-links" data-online-only>${canSignup ? '<button type="button" class="linkbtn" data-act="signup">Create new login</button>' : '<span></span>'}<button type="button" class="linkbtn" data-act="forgot">Forgot password?</button></div>
  <p class="muted sm" style="margin-top:14px" data-offline-only>Creating a new login or resetting a password needs an internet connection.</p>`;
function syncNetUi() {
  const on = HAS_SERVER && navigator.onLine;
  document.querySelectorAll('[data-online-only]').forEach(el => { el.hidden = !on; });
  document.querySelectorAll('[data-offline-only]').forEach(el => { el.hidden = on; });
}

/* Sign-up / forgot password / first approver, on one card in two steps:
   (1) name + mobile → OTP by SMS; (2) OTP + password → request sent to the approver, or login ready.
   purpose: 'register' | 'reset' | 'setup'. back(mobile?) returns to the login screen. */
function renderAccountFlow({ role, purpose, back, prefill = '' }) {
  const title = { register: `Create new ${ROLE_NAME[role]} login`, reset: `Reset ${ROLE_NAME[role]} password`, setup: 'Create the approver account' }[purpose];
  const head = `<div class="eyebrow">${CONSOLE_NAME[role]}</div><h3>${title}</h3>`;
  if (!HAS_SERVER || !navigator.onLine) {
    app.innerHTML = `<div class="auth card">${head}<p class="muted">This needs an internet connection, because an OTP is sent to your mobile number.</p><div class="actions"><button class="btn" data-act="back">Back</button></div></div>`;
    bind(app, { back: () => back() }); return;
  }
  const st = { mobile: normMobile(prefill) || '', name: '', setupKey: null, sent: null, sentAt: 0 };
  let timer = null;
  const sendOtp = async () => {
    const r = await api('auth/otp', { method: 'POST', token: null, body: { mobile: st.mobile, role, purpose, setupKey: st.setupKey, device: await deviceInfo(role) } });
    st.sent = r; st.sentAt = Date.now();
  };
  const step1 = () => {
    clearInterval(timer);
    const intro = { register: 'Verify your mobile number with an OTP and choose a password. Your request then goes to the approver, and you can log in once it is approved. If the approver has already added your number, your login is ready straight away.',
      reset: 'Verify your mobile number with an OTP, then choose a new password.', setup: 'One-time step: enter the setup key configured on the server, then verify your mobile number with an OTP.' }[purpose];
    app.innerHTML = `<div class="auth card">${head}<p class="muted sm">${intro}</p>
      <form class="form" id="af" novalidate>
        ${purpose === 'setup' ? '<label class="fld"><span>Setup key</span><input name="k" type="password" autocomplete="off"></label>' : ''}
        ${purpose !== 'reset' ? `<label class="fld"><span>Full name</span><input name="n" autocomplete="name" maxlength="80" value="${esc(st.name)}"></label>` : ''}
        <label class="fld"><span>Mobile number</span><input name="m" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="10-digit mobile number" value="${esc(st.mobile)}"></label>
        <div class="err" hidden></div>
        <div class="actions"><button type="button" class="btn ghost" data-act="back">Back</button><button class="btn primary">Send OTP</button></div></form></div>`;
    bind(app, { back: () => back() });
    const f = $('#af'), er = f.querySelector('.err'), btn = f.querySelector('.btn.primary');
    (f.k || f.n || f.m).focus();
    f.onsubmit = async ev => {
      ev.preventDefault(); er.hidden = true;
      const mobile = normMobile(f.m.value), name = f.n ? f.n.value.trim() : '';
      if (f.k && !f.k.value) return showErr(er, 'Setup key is required.');
      if (f.n && !name) return showErr(er, 'Please enter your name.');
      if (!mobile) return showErr(er, 'Enter a valid 10-digit mobile number.');
      Object.assign(st, { mobile, name, setupKey: f.k ? f.k.value : null });
      btn.disabled = true; btn.textContent = 'Sending OTP…';
      try { await sendOtp(); step2(); }
      catch (e) { showErr(er, e.message); btn.disabled = false; btn.textContent = 'Send OTP'; }
    };
  };
  const step2 = () => {
    app.innerHTML = `<div class="auth card">${head}
      <div class="notice info sm" id="sentNote">OTP sent by SMS to <b>${esc(st.sent.sentTo)}</b>. It is valid for ${Math.round(st.sent.expiresInSeconds / 60)} minutes.</div>
      <form class="form" id="af" novalidate>
        <label class="fld"><span>OTP</span><input name="o" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit OTP"></label>
        <label class="fld"><span>${purpose === 'reset' ? 'New password' : 'Choose a password'} (min 8 characters)</span><input name="p" type="password" autocomplete="new-password"></label>
        <label class="fld"><span>Confirm password</span><input name="p2" type="password" autocomplete="new-password"></label>
        <div class="err" hidden></div>
        <div class="actions"><button type="button" class="btn ghost" data-act="change">Change number</button><button class="btn primary">${purpose === 'register' ? 'Verify & send request' : 'Verify & save'}</button></div></form>
      <div class="auth-links"><button type="button" class="linkbtn" data-act="resend">Resend OTP</button><button type="button" class="linkbtn" data-act="back">Back to login</button></div></div>`;
    const f = $('#af'), er = f.querySelector('.err'), btn = f.querySelector('.btn.primary');
    const tick = () => {
      const b = app.querySelector('[data-act=resend]'); if (!b) return clearInterval(timer);
      const left = Math.ceil((st.sentAt + st.sent.resendAfterSeconds * 1000 - Date.now()) / 1000);
      b.disabled = left > 0; b.style.opacity = left > 0 ? .5 : 1; b.textContent = left > 0 ? `Resend OTP in ${left}s` : 'Resend OTP';
      if (left <= 0) clearInterval(timer);
    };
    clearInterval(timer); timer = setInterval(tick, 1000); tick();
    bind(app, {
      change: step1, back: () => { clearInterval(timer); back(); },
      resend: async () => { er.hidden = true; try { await sendOtp(); $('#sentNote').innerHTML = `A new OTP was sent to <b>${esc(st.sent.sentTo)}</b>. Use the latest one.`; clearInterval(timer); timer = setInterval(tick, 1000); tick(); } catch (e) { showErr(er, e.message); } }
    });
    f.o.focus();
    f.onsubmit = async ev => {
      ev.preventDefault(); er.hidden = true;
      const otp = f.o.value.trim(), p = f.p.value;
      if (!/^\d{6}$/.test(otp)) return showErr(er, 'Enter the 6-digit OTP from the SMS.');
      if (p.length < 8) return showErr(er, 'Password must be at least 8 characters.');
      if (p !== f.p2.value) return showErr(er, 'Passwords do not match.');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try { const r = await api('auth/complete', { method: 'POST', token: null, body: { mobile: st.mobile, role, purpose, otp, name: st.name, password: p, setupKey: st.setupKey, device: await deviceInfo(role) } }); clearInterval(timer); done(r); }
      catch (e) { showErr(er, e.message); btn.disabled = false; btn.textContent = purpose === 'register' ? 'Verify & send request' : 'Verify & save'; }
    };
  };
  const done = r => {
    const pending = r.status === 'pending';
    app.innerHTML = `<div class="auth card">${head}
      <div class="notice ${pending ? 'info' : 'ok'}">${pending ? '✔ Request sent to the approver' : '✔ Your login is ready'}</div>
      <p>${pending ? `Your request for ${role === 'admin' ? 'an' : 'a'} <b>${ROLE_NAME[role]}</b> login (mobile ${esc(st.mobile)}) is waiting for the approver. You can log in with your mobile number and password once it is approved.${r.pendingRequests > 1 ? `<br><span class="muted sm">This number now has ${r.pendingRequests} requests for this login; the approver sees them together.</span>` : ''}`
        : `Log in with mobile number <b>${esc(st.mobile)}</b> and the password you just set.`}</p>
      <div class="actions"><button class="btn primary" data-act="login">Go to login</button></div></div>`;
    bind(app, { login: () => back(st.mobile) });
  };
  step1();
}

/* Online-only consoles (Admin, Approver) first check that the server answers */
async function serverCheck(retry) {
  if (!HAS_SERVER) { app.innerHTML = `<div class="auth card"><h3>This console needs the server</h3><p class="muted">Open the hosted portal URL to use it.</p><div class="actions"><button class="btn" data-act="back">Back</button></div></div>`; bind(app, { back: renderLanding }); return null; }
  try { return await api('status', { token: null }); }
  catch (e) { app.innerHTML = `<div class="auth card"><h3>Server not reachable</h3><p class="muted">${esc(e.message)}</p><div class="actions"><button class="btn" data-act="back">Back</button><button class="btn primary" data-act="retry">Retry</button></div></div>`; bind(app, { back: renderLanding, retry: () => retry() }); return null; }
}
async function renderAdminAuth(prefill = '') {
  if (typeof prefill !== 'string') prefill = '';
  if (!await serverCheck(renderAdminAuth)) return;
  app.innerHTML = loginCard({ role: 'admin', title: 'Admin login', idLabel: 'Mobile number (or existing admin username)', prefill, links: accountLinks() });
  syncNetUi();
  const again = m => renderAdminAuth(m || '');
  bind(app, { back: renderLanding, signup: () => renderAccountFlow({ role: 'admin', purpose: 'register', back: again }),
    forgot: () => renderAccountFlow({ role: 'admin', purpose: 'reset', back: again, prefill: $('#lf').u.value }) });
  const f = $('#lf'); (prefill ? f.p : f.u).focus();
  f.onsubmit = async e => {
    e.preventDefault(); const er = f.querySelector('.err'), btn = f.querySelector('.btn.primary'); er.hidden = true;
    if (!f.u.value.trim() || !f.p.value) return showErr(er, 'Enter your mobile number and password.');
    btn.disabled = true;
    try {
      const r = await api('admin/login', { method: 'POST', token: null, body: { username: f.u.value.trim(), password: f.p.value, clientClock: new Date().toISOString(), device: await deviceInfo('admin') } });
      astate.tab = 'exams'; astate.examId = null;
      setSession({ role: 'admin', user: r.user, name: r.name || null, token: r.token }); renderAdmin();
    } catch (err) { showErr(er, err.message); btn.disabled = false; }
  };
}

/* =========================================================

function detailSummary(d) {
  return Object.entries(d).map(([k, v]) => `<b>${esc(k)}</b>: ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`).join(' · ');
}
async function getAudit(scope) {
  if (scope === 'client') return verifyChain('client');
  const { entries } = await api(scope === 'approver' ? 'approver/audit' : 'admin/audit');   // same server log, read with the console's own session
  const r = await verifyEntries(entries);   // re-verified in the browser, independent of the server's own check
  return { ...r, entries };
}
async function renderAudit(v, scope) {
  const r = await getAudit(scope);
  const entries = [...r.entries].reverse();
  const where = scope !== 'client' ? 'Stored on the server (Neon Postgres). Covers admin actions, logins, OTPs, sign-up requests and approvals. ' : 'Stored in this browser and synced to the server whenever the PC is online. ';
  v.innerHTML = `<div class="toolbar">${pageHead(scope === 'client' ? 'This PC · hash-chained' : 'Server · hash-chained', 'Audit <em>log</em>')}<div class="sp"></div>
      <button class="btn" data-act="verify">✔ Verify integrity</button>
      <button class="btn primary" data-act="json">⬇ Export audit log (JSON)</button>
      <button class="btn" data-act="csv">⬇ Export audit log (CSV)</button>
      ${scope === 'client' ? '<button class="btn" data-act="res">⬇ Export results (CSV)</button>' : ''}</div>
    <p class="muted sm">${where}</p>
    <div class="notice ${r.ok ? 'ok' : 'warn'}">${r.ok ? `✔ Hash chain intact — ${r.count} entries. Chain head: <span class="mono">${r.head.slice(0, 32)}…</span>` : `⛔ Integrity problems found:<ul>${r.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`}</div>
    <div class="card" style="padding:0;overflow:auto"><table class="tbl log-table" style="margin:0"><thead><tr><th>#</th><th>Time</th><th>User</th><th>Event</th><th>Details</th><th>Hash</th></tr></thead>
    <tbody>${entries.slice(0, 500).map(e => `<tr><td>${e.seq}</td><td class="mono">${esc(fmtTs(e.ts))}</td><td>${esc(e.actor)}</td><td><b>${esc(e.event)}</b></td><td class="det">${detailSummary(e.details)}</td><td class="mono" title="${e.hash}">${e.hash.slice(0, 12)}…</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No entries.</td></tr>'}</tbody></table></div>
    ${entries.length > 500 ? '<p class="muted sm">Showing latest 500 entries. Export for the full log.</p>' : ''}`;
  bind(v, {
    verify: async () => { const x = await getAudit(scope); if (scope === 'client') { await appendLog('client', 'AUDIT_VERIFIED', { ok: x.ok, entries: x.count, issues: x.issues }); integrityIssue = x.ok ? null : x.issues[0]; renderBanners(); } toast(x.ok ? 'Integrity verified ✔' : 'Integrity problems found'); renderAudit(v, scope); },
    json: () => exportAudit(scope, 'json'), csv: () => exportAudit(scope, 'csv'), res: exportResults
  });
}
async function exportAudit(scope, kind) {
  if (scope === 'client') await appendLog(scope, 'AUDIT_EXPORTED', { format: kind });
  const r = await getAudit(scope);
  const name = `UPESSC_QPR_${scope === 'client' ? 'RANDOMIZATION' : 'SERVER'}_AUDIT_${stamp()}`;
  if (kind === 'json') {
    const out = { format: 'UPESSC-QPR-AUDIT', console: scope, system: 'UPESSC Question Paper Randomization System', exportedAt: new Date().toISOString(), exportedBy: session.user, installId: scope === 'client' ? await installId() : 'server',
      verification: { ok: r.ok, issues: r.issues, entries: r.count, chainHead: r.head, method: 'hash = SHA-256(canonical JSON of entry without "hash", keys sorted); prevHash links each entry to the previous one, first prevHash = "GENESIS"' },
      entries: r.entries };
    if (scope === 'client') { out.draws = await idb.all('draws'); out.exams = await idb.all('client_exams'); }
    download(name + '.json', JSON.stringify(out, null, 2));
  } else {
    download(name + '.csv', toCsv([['Seq', 'Local time', 'ISO time', 'User', 'Event', 'Details', 'Prev hash', 'Hash'], ...r.entries.map(e => [e.seq, fmtTs(e.ts), e.time, e.actor, e.event, JSON.stringify(e.details), e.prevHash, e.hash])]), 'text/csv');
  }
}
async function exportResults() {
  const exams = await idb.all('client_exams'), draws = await idb.all('draws'), choices = await choiceMap(); const D = new Map(draws.map(d => [d.key, d]));
  const rows = [['Exam', 'Exam code', 'Shift', 'Date', 'Subject', 'Subject code', ...ORD.flatMap(o => [`${o} attempt`, `${o} time`]), 'Final iteration', 'Final colour', 'Status']];
  exams.forEach(e => { const T = totalFor(e, choices); e.shifts.forEach(s => s.subjects.forEach(sb => {
    const cells = []; let n = 0;
    for (let a = 1; a <= MAX_FINAL; a++) { const d = D.get(dkey(e.id, s.id, sb.id, a)); if (d) n++; cells.push(d ? d.colour.name : '', d ? fmtTs(d.ts) : ''); }
    const fd = T && D.get(dkey(e.id, s.id, sb.id, T));
    rows.push([e.name, e.code, s.name, fmtDate(s.date), sb.name, sb.code || '', ...cells, T ? ORD[T - 1] : 'not drawn yet', fd ? fd.colour.name : '',
      !T ? 'Final iteration not drawn yet' : n === T ? 'FINAL LOCKED' : n ? `In progress (${n}/${T})` : 'Not started']);
  })); });
  await appendLog('client', 'RESULTS_EXPORTED', { rows: rows.length - 1 });
  download(`UPESSC_QPR_RESULTS_${stamp()}.csv`, toCsv(rows), 'text/csv');
}

/* =========================================================

async function renderApproverAuth(prefill = '') {
  if (typeof prefill !== 'string') prefill = '';
  const st = await serverCheck(renderApproverAuth); if (!st) return;
  const again = m => renderApproverAuth(m || '');
  if (!st.approverExists) {
    app.innerHTML = `<div class="auth card"><div class="eyebrow">Approver Console</div><h3>No approver yet</h3>
      <p class="muted sm">The approver account is created once, using the setup key configured on the server. The approver then reviews every request for a new Admin or Randomizer login.</p>
      ${st.smsReady ? '' : '<div class="notice warn sm">OTP SMS is not configured on the server yet, so no OTP can be sent. Set the SMS environment variables first.</div>'}
      <div class="actions"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" data-act="setup">Create approver account</button></div></div>`;
    bind(app, { back: renderLanding, setup: () => renderAccountFlow({ role: 'approver', purpose: 'setup', back: again }) });
    return;
  }
  app.innerHTML = loginCard({ role: 'approver', title: 'Approver login', idLabel: 'Mobile number', prefill, links: accountLinks(false) });
  syncNetUi();
  bind(app, { back: renderLanding, forgot: () => renderAccountFlow({ role: 'approver', purpose: 'reset', back: again, prefill: $('#lf').u.value }) });
  const f = $('#lf'); (prefill ? f.p : f.u).focus();
  f.onsubmit = async e => {
    e.preventDefault(); const er = f.querySelector('.err'), btn = f.querySelector('.btn.primary'); er.hidden = true;
    const mobile = normMobile(f.u.value);
    if (!mobile) return showErr(er, 'Enter your 10-digit mobile number.');
    if (!f.p.value) return showErr(er, 'Enter your password.');
    btn.disabled = true;
    try {
      const r = await api('approver/login', { method: 'POST', token: null, body: { username: mobile, password: f.p.value, device: await deviceInfo('approver') } });
      pstate.tab = 'requests'; pstate.show = 'pending';
      setSession({ role: 'approver', user: r.user, name: r.name, token: r.token }); renderApprover();
    } catch (err) { showErr(er, err.message); btn.disabled = false; }
  };
}

function shiftWindow(s) { return { start: new Date(`${s.date}T${s.start}:00`).getTime(), end: new Date(`${s.date}T${s.end}:59.999`).getTime() }; }

/* Number of attempts for an exam: 5 in Mode A; the locked random draw in Mode B (null until drawn) */
const totalFor = (e, choices) => isClientMode(e) ? ((choices.get(e.id) || {}).finalAttempt || null) : ATTEMPTS;
async function finalPlan(e) { const choice = isClientMode(e) ? await idb.get('choices', e.id) : null; return { mode: isClientMode(e) ? 'client' : 'fixed', total: isClientMode(e) ? (choice ? choice.finalAttempt : null) : ATTEMPTS, choice }; }

  s.subjects.forEach(sb => { for (let a = 1; a <= T; a++) if (D.has(dkey(e.id, s.id, sb.id, a))) done++; });
  return { done, total, complete: total > 0 && done === total };
}

}

/* Merge a downloaded/imported exam. In a shift where randomization has started, the time window and
   every subject that already has a draw stay frozen; subjects without draws take the new version. */
async function mergeExam(ex, meta) {
  const existing = await idb.get('client_exams', ex.id);
  if (existing && existing.packageVersion > meta.packageVersion) return { skipped: `newer v${existing.packageVersion} already present` };
  const draws = (await idb.all('draws')).filter(d => d.examId === ex.id);
  const startedShifts = new Set(draws.map(d => d.shiftId)), drawnSubjects = new Set(draws.map(d => d.shiftId + '|' + d.subjectId));
  const updated = [], keptLocked = [];
  const mergeShift = (s, old) => {
    if (!old || !startedShifts.has(s.id)) { updated.push(s.name); return s; }
    const subjects = s.subjects.map(b => {
      const ob = old.subjects.find(x => x.id === b.id);
      if (ob && drawnSubjects.has(s.id + '|' + b.id)) { keptLocked.push(`${old.name} / ${ob.name}`); return ob; }
      updated.push(`${old.name} / ${b.name}`); return b;
    });
    old.subjects.forEach(ob => { if (drawnSubjects.has(s.id + '|' + ob.id) && !subjects.some(b => b.id === ob.id)) { subjects.push(ob); keptLocked.push(`${old.name} / ${ob.name}`); } });
    if (s.date !== old.date || s.start !== old.start || s.end !== old.end) keptLocked.push(`${old.name} time window`);
    return { ...s, name: old.name, date: old.date, start: old.start, end: old.end, subjects };
  };
  const shifts = ex.shifts.map(s => mergeShift(s, existing && existing.shifts.find(o => o.id === s.id)));
  if (existing) existing.shifts.forEach(o => { if (startedShifts.has(o.id) && !shifts.some(s => s.id === o.id)) { shifts.push(o); keptLocked.push(o.name); } });
  const { packageVersion, exportedAt, ...doc } = ex;
  if (existing && (draws.length || await idb.get('choices', ex.id)) && (existing.finalMode || 'fixed5') !== (doc.finalMode || 'fixed5')) { doc.finalMode = existing.finalMode || 'fixed5'; keptLocked.push('final selection mode'); }
  await idb.put('client_exams', { ...doc, shifts: shifts.map(cleanShift), ...meta, importedAt: Date.now() });
  return { updated, keptLocked };
}

/* Upload the local audit chain + draws to the server (append-only on the server side) */
let syncing = false;
async function syncNow(auto = false) {
  if (syncing || !HAS_SERVER || !navigator.onLine) { if (!auto) toast(navigator.onLine ? 'Sync already running' : 'Offline — results will sync when the PC is back online'); return; }
  const token = await idb.get('meta', 'client_token');
  if (!token) { if (!auto) toast('Log in online once to enable sync'); return; }
  syncing = true;
  try {
    const entries = (await idb.all('client_log')).sort((a, b) => a.seq - b.seq), draws = await idb.all('draws'), choices = await idb.all('choices');
    const r = await api('client/sync', { method: 'POST', token, body: { installId: await installId(), entries, draws, choices } });
    await idb.put('meta', { at: Date.now(), upToSeq: entries.length ? entries[entries.length - 1].seq : 0, draws: r.draws, ok: r.ok, conflicts: r.conflicts }, 'last_sync');
    await appendLog('client', 'SYNC_COMPLETED', { upToSeq: entries.length ? entries[entries.length - 1].seq : 0, entries: r.entries, draws: r.draws, serverChainOk: r.chainOk, conflicts: r.conflicts });
    if (!auto || !r.ok) toast(r.ok ? `Synced ✔ ${r.draws} draw(s), ${r.entries} log entries` : 'Synced with conflicts. See server results.');
  } catch (err) {
    await appendLog('client', 'SYNC_FAILED', { reason: err.message });
    if (!auto) toast('Sync failed: ' + err.message);
    if (err.status === 401) await idb.del('meta', 'client_token');
  } finally { syncing = false; if (session && session.role === 'client' && !busy && !$('#modalRoot').children.length) renderClient(); }
}
