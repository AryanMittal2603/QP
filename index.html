      const open = e.shifts.filter(s => windowState(s) === 'open' && !shiftProgress(e, s, D, T).complete).length;
      const locked = e.shifts.filter(s => shiftProgress(e, s, D, T).complete).length;
      return `<div class="card click" data-act="open" data-id="${e.id}"><div class="eyebrow">${esc(e.code)}</div><h3>${esc(e.name)}</h3><div class="muted sm">${e.shifts.length} shift(s) · published v${e.packageVersion}</div><div class="muted sm">${modeText(e, T)}</div>
        <div style="margin-top:8px">${open ? `<span class="badge b-open">● ${open} shift(s) open now</span> ` : ''}${locked ? `<span class="badge b-lock">🔒 ${locked} locked</span>` : ''}${!open && !locked ? '<span class="badge b-closed">No window open now</span>' : ''}</div></div>`; }).join('')}</div>`
    : '<div class="empty">No exams on this PC yet. Log in while online to download the published exams.</div>'}`;
  bind(v, { open: async d => { cstate.view = 'exam'; cstate.examId = d.id; const e = exams.find(x => x.id === d.id); await appendLog('client', 'EXAM_SELECTED', { examId: e.id, examName: e.name, examCode: e.code }); renderClient(); } });
}

async function renderClientExam(v) {
  const e = await idb.get('client_exams', cstate.examId); if (!e) { cstate.view = 'exams'; return renderClient(); }
  const D = await drawMap(e.id), T = (await finalPlan(e)).total;
  const shifts = [...e.shifts].sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  v.innerHTML = `<div class="toolbar"><button class="btn" data-act="back">← Exams</button><div class="head"><div class="eyebrow">${esc(e.code)}</div><h2>${esc(e.name)}</h2><div class="muted sm">${modeText(e, T)}</div></div></div>
    <div class="grid-cards">${shifts.map(s => { const p = shiftProgress(e, s, D, T); return `<div class="card click" data-act="open" data-id="${s.id}"><h3>${esc(s.name)}</h3>
      <div class="muted sm">📅 ${fmtDate(s.date)} · Window ${s.start} – ${s.end}</div><div class="muted sm">${s.subjects.length} subject(s)</div><div style="margin-top:8px">${stateBadge(s, p)}</div></div>`; }).join('')}</div>`;
  bind(v, { back: () => { cstate.view = 'exams'; renderClient(); },
    open: async d => { const s = e.shifts.find(x => x.id === d.id); cstate.view = 'shift'; cstate.shiftId = s.id; await appendLog('client', 'SHIFT_OPENED', { examId: e.id, examCode: e.code, shiftId: s.id, shiftName: s.name, windowState: windowState(s) }); renderClient(); } });
}

async function renderShift(v) {
  const e = await idb.get('client_exams', cstate.examId); const s = e && e.shifts.find(x => x.id === cstate.shiftId);
  if (!s) { cstate.view = 'exams'; return renderClient(); }
  const T = (await finalPlan(e)).total;
  const D = await drawMap(e.id), p = shiftProgress(e, s, D, T), w = windowState(s), canRoll = !!T && w === 'open' && !p.complete && !navigator.onLine;
  let note;
  if (p.complete) note = `<div class="notice lock">🔒 This shift is permanently LOCKED. All final colours have been selected. No further changes are possible.</div>`;
  else if (w === 'open' && navigator.onLine) note = `<div class="notice warn">🔌 The randomization window is open, but this PC is CONNECTED to a network. Disconnect the network cable / Wi-Fi to enable the dice. Randomization is only allowed offline.</div>`;
  else if (w === 'open') note = `<div class="notice ok">● Randomization window is OPEN until ${s.end} on ${fmtDate(s.date)}. Each draw is final and is locked immediately.</div>`;
  else if (w === 'upcoming') note = `<div class="notice info">Randomization for this shift opens at <b>${s.start}</b> on <b>${fmtDate(s.date)}</b> (PC clock).</div>`;
  else note = `<div class="notice warn">The randomization window (${s.start} – ${s.end} on ${fmtDate(s.date)}) has closed. Results are view-only.</div>`;
  const canPick = !T && w === 'open' && !navigator.onLine;
  const finals = T ? s.subjects.filter(sb => D.has(dkey(e.id, s.id, sb.id, T))).length : 0;
  const stats = `<div class="stats">
      <div class="stat"><div class="v">${p.done}<small>/ ${p.total || '—'}</small></div><div class="l">rolls recorded in this shift</div></div>
      <div class="stat amber"><div class="v">${T ? ORD[T - 1] : '—'}</div><div class="l">final iteration ${isClientMode(e) ? (T ? '· drawn at random' : '· not drawn yet') : '· fixed'}</div></div>
      <div class="stat green"><div class="v">${finals}<small>/ ${s.subjects.length}</small></div><div class="l">subjects with a final colour</div></div>
      <div class="stat ${w === 'open' ? 'blue' : 'rust'}"><div class="v">${s.start}<small>– ${s.end}</small></div><div class="l">randomization window · ${fmtDate(s.date)} · ${w}</div></div></div>`;
  const choosePanel = T ? '' : `<div class="card callout"><h3>Draw the final iteration for this exam</h3>
      <p>This exam uses a <b>randomly drawn final iteration</b>. Before the first roll, the system draws at random which iteration (${ORD[MIN_FINAL - 1]}–${ORD[MAX_FINAL - 1]}, each equally likely) gives the FINAL question paper colour.
      The result applies to <b>every shift and every subject</b> of ${esc(e.name)} and is <b>locked permanently</b>.</p>
      <div class="row" style="align-items:center"><button class="btn gold" data-act="pickFinal" ${canPick ? '' : 'disabled'}>🎲 Draw final iteration</button>${canPick ? '' : '<span class="muted sm">Available offline while the randomization window is open.</span>'}</div></div>`;
  const cell = (sb, a) => {
    const d = D.get(dkey(e.id, s.id, sb.id, a)); const fin = a === T ? 'final' : '';
    if (d) return `<td class="${fin}"><div class="chip" style="--c:${d.colour.hex}"><span class="sw"></span><span><b>${esc(d.colour.name)}</b></span>${LOCK_SVG}</div><div class="ts">${fmtTime(d.ts)} · #${d.logSeq}</div></td>`;
    let next = 1; while (next <= T && D.has(dkey(e.id, s.id, sb.id, next))) next++;
    if (a === next) return `<td class="${fin}"><button class="btn ${a === T ? 'gold' : 'primary'}" data-act="roll" data-b="${sb.id}" data-a="${a}" ${canRoll ? '' : 'disabled'}>🎲 ${a === T ? 'Final roll' : 'Roll'}</button></td>`;
    return `<td class="${fin} pending" style="color:var(--rule)">—</td>`;
  };
  const cols = Array.from({ length: T || 0 }, (_, i) => i + 1);
  v.innerHTML = `<div class="toolbar"><button class="btn" data-act="back">← Shifts</button><div class="grow head"><div class="eyebrow">${esc(e.name)} · ${esc(e.code)}</div><h2>${esc(s.name)} <span style="font-size:13px">${stateBadge(s, p)}</span></h2><div class="muted sm">${modeText(e, T)}</div></div><div class="sp"></div>
      <button class="btn" data-act="audit">Audit log</button></div>
    ${stats}${choosePanel}${note}
    <div class="rgrid-wrap"><table class="rgrid"><thead><tr><th>Subject & question paper colours</th>${T ? cols.map(a => `<th class="${a === T ? 'final' : ''}">${attemptLabel(a, T)}</th>`).join('') : '<th>Attempts</th>'}</tr></thead>
    <tbody>${s.subjects.map(sb => `<tr><td class="subj"><b>${esc(sb.name)}</b>${sb.code ? ` <span class="muted sm">${esc(sb.code)}</span>` : ''}<div class="swatches" style="margin-top:5px">${sb.colours.map(swMini).join('')}</div></td>${T ? cols.map(a => cell(sb, a)).join('') : '<td class="muted">Draw the final iteration first</td>'}</tr>`).join('')}</tbody></table></div>
    <p class="muted sm" style="margin-top:12px">Every draw uses the browser's cryptographic random number generator (crypto.getRandomValues) with unbiased rejection sampling. Each attempt is an independent draw from all colours of that subject. Results are written to the hash-chained audit log before the animation finishes, so a refresh or power cut cannot alter them.</p>`;
  bind(v, { back: () => { cstate.view = 'exam'; renderClient(); }, audit: () => { cstate.view = 'audit'; renderClient(); }, roll: d => doDraw(e.id, s.id, d.b, +d.a), pickFinal: () => drawFinalIteration(e.id, s.id) });
}

/* Mode B: draw the final iteration (3rd–7th) at random for the whole exam, before any roll, and lock it.
   Same rules as a roll: offline only, inside the shift's window, recorded in the audit log before the animation. */
async function drawFinalIteration(examId, shiftId) {
  if (busy) return; busy = true;
  try {
    await checkClock('pre-final-iteration-draw');
    const e = await idb.get('client_exams', examId), s = e && e.shifts.find(x => x.id === shiftId);
    if (!s || !isClientMode(e)) return;
    if (await idb.get('choices', examId)) { toast('The final iteration is already locked.'); return; }
    if ((await idb.all('draws')).some(d => d.examId === examId)) { toast('Randomization has already started for this exam.'); return; }
    if (navigator.onLine) { await appendLog('client', 'FINAL_ITERATION_BLOCKED_NETWORK_CONNECTED', { examId, examCode: e.code, shiftName: s.name }); toast('Disconnect the network to randomize.'); return; }
    if (windowState(s) !== 'open') { await appendLog('client', 'FINAL_ITERATION_BLOCKED_OUTSIDE_WINDOW', { examId, examCode: e.code, shiftName: s.name }); toast('Randomization window is not open (PC clock).'); return; }
    const pool = Array.from({ length: MAX_FINAL - MIN_FINAL + 1 }, (_, i) => MIN_FINAL + i);
    const ok = await confirmModal('Draw the final iteration?',
      `<p>For <b>${esc(e.name)}</b> (${esc(e.code)}), the system will now draw at random which iteration gives the FINAL question paper colour.</p>
       <p>Possible results: ${pool.map(n => `<b>${ORD[n - 1]}</b>`).join(', ')} (each has a 1 in ${pool.length} chance).</p>
       <p style="margin-top:12px"><b>The result applies to every subject in every shift of this exam and is locked permanently. It cannot be redrawn.</b></p>`,
      '🎲 Draw final iteration', 'gold');
    if (!ok) { await appendLog('client', 'FINAL_ITERATION_DRAW_CANCELLED', { examId, examCode: e.code, shiftName: s.name }); return; }
    // ---- random selection ----
    const rnd = secureRandomInt(pool.length), n = pool[rnd.value];
    // Persist FIRST (choice + audit entry in one atomic transaction), then animate.
    const entry = await appendLog('client', 'FINAL_ITERATION_RANDOMIZED', { examId, examCode: e.code, examName: e.name, finalAttempt: n, pool: pool.map(x => ORD[x - 1]), poolSize: pool.length,
      drawIndex: rnd.value, rng: 'crypto.getRandomValues Uint32 + rejection sampling', rawValue: rnd.raw, rngTries: rnd.tries, drawnBy: session.user, shiftId, shiftName: s.name,
      clockReading: new Date().toISOString(), networkOnline: navigator.onLine },
      { extra: en => ({ store: 'choices', value: { examId, examCode: e.code, finalAttempt: n, method: 'random', drawnBy: session.user, ts: en.ts, logSeq: en.seq, logHash: en.hash } }) });
    await animateFinalIteration(e, s, pool, rnd.value, entry);
  } catch (err) {
    console.error(err);
    await alertModal('Final iteration not recorded', `<p>${esc(err.message || err)}</p><p class="muted">No result was saved. If it was already drawn it remains locked.</p>`);
  } finally { busy = false; renderClient(); }
}

/* ---------- the draw ---------- */
const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
const faceHtml = (i, c) => `<div class="face f${i}" style="--c:${c.hex};--ink:${ink(c.hex)}">${[1,2,3,4,5,6,7,8,9].map(p => `<i class="${PIPS[i].includes(p) ? 'p' : ''}"></i>`).join('')}</div>`;

async function doDraw(examId, shiftId, subjectId, attempt) {
  if (busy) return; busy = true;
  try {
    await checkClock('pre-draw');
    const e = await idb.get('client_exams', examId), s = e.shifts.find(x => x.id === shiftId), sb = s.subjects.find(x => x.id === subjectId);
    const plan = await finalPlan(e), T = plan.total;
    if (!T) { toast('Draw the final iteration first.'); return renderClient(); }
    if (attempt < 1 || attempt > T) { toast('Invalid attempt.'); return renderClient(); }
    if (navigator.onLine) { await appendLog('client', 'DRAW_BLOCKED_NETWORK_CONNECTED', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); toast('Disconnect the network to randomize.'); return renderClient(); }
    if (windowState(s) !== 'open') { await appendLog('client', 'DRAW_BLOCKED_OUTSIDE_WINDOW', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); toast('Randomization window is not open (PC clock).'); return renderClient(); }
    const n = sb.colours.length;
    const ok = await confirmModal(`${sb.name} — ${attemptLabel(attempt, T)}`,
      `<p>${esc(e.name)} · ${esc(s.name)}</p><p>Pool of ${n} question paper colours (each has a 1 in ${n} chance):</p><div class="swatches">${sb.colours.map(swMini).join('')}</div>
       <p style="margin-top:12px"><b>${attempt === T ? 'This is the FINAL draw. The selected colour becomes the final question paper colour for this subject and the subject will be permanently locked.' : 'The result of this attempt will be locked permanently and cannot be redone.'}</b></p>`,
      attempt === T ? '🎲 Roll FINAL' : '🎲 Roll the dice', attempt === T ? 'gold' : 'primary');
    if (!ok) { await appendLog('client', 'DRAW_CANCELLED', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); return; }

    const key = dkey(examId, shiftId, subjectId, attempt);
    const D = await drawMap(examId);
    if (D.has(key)) { toast('This attempt is already locked.'); return renderClient(); }
    for (let a = 1; a < attempt; a++) if (!D.has(dkey(examId, shiftId, subjectId, a))) { toast('Previous attempts must be completed first.'); return renderClient(); }

    // ---- random selection ----
    const rnd = secureRandomInt(n), colour = cleanColour(sb.colours[rnd.value]);
    const details = { key, examId, examName: e.name, examCode: e.code, packageVersion: e.packageVersion, shiftId, shiftName: s.name, shiftDate: s.date, window: `${s.start}-${s.end}`,
      subjectId, subjectName: sb.name, subjectCode: sb.code || '', attempt, attemptLabel: attemptLabel(attempt, T), pool: sb.colours.map(c => c.name), poolSize: n,
      colourIndex: rnd.value, colour, rng: 'crypto.getRandomValues Uint32 + rejection sampling', rawValue: rnd.raw, rngTries: rnd.tries, clockReading: new Date().toISOString(), networkOnline: navigator.onLine, finalAttempt: T, finalMode: plan.mode, isFinal: attempt === T };
    // Persist FIRST (draw + audit entry in one atomic transaction), then animate.
    const entry = await appendLog('client', 'RANDOMIZATION_DRAW', details, { extra: en => ({ store: 'draws', value: { key, examId, shiftId, subjectId, subjectName: sb.name, attempt, colourIndex: rnd.value, colour, ts: en.ts, logSeq: en.seq, logHash: en.hash } }) });
    await animateRoll(e, s, sb, attempt, rnd.value, entry, T);

    if (attempt === T) {
      await appendLog('client', 'SUBJECT_FINAL_LOCKED', { examCode: e.code, shiftName: s.name, subjectName: sb.name, finalColour: colour, drawSeq: entry.seq });
      const D2 = await drawMap(examId);
      if (shiftProgress(e, s, D2, T).complete) {
        await appendLog('client', 'SHIFT_LOCKED', { examCode: e.code, shiftId, shiftName: s.name, finals: s.subjects.map(x => ({ subject: x.name, colour: D2.get(dkey(examId, shiftId, x.id, T)).colour.name })) });
        await alertModal('Shift locked', `<p>All subjects of <b>${esc(s.name)}</b> have their final colour. The shift is now permanently locked.</p><p class="muted">Please export the audit log (Audit Log tab) and store it on secure media. Results will sync to the server automatically when the PC is reconnected.</p>`);
      }
    }
  } catch (err) {
    console.error(err);
    await alertModal('Draw not recorded', `<p>${esc(err.message || err)}</p><p class="muted">No result was saved. If this attempt was already drawn it remains locked.</p>`);
  } finally { busy = false; renderClient(); }
}

/* N-sided rolling prism ("long dice"): one face per item, ends with face k at the front */
function prismShape(faces, k) {   // faces: [{ hex, label }]
  const N = faces.length, R = 92, step = 360 / N, h = 2 * R * Math.sin(Math.PI / N), apo = R * Math.cos(Math.PI / N);
  const fs = Math.max(11, Math.min(22, h * 0.32)), turns = 4 + Math.floor(Math.random() * 3);
  return {
    shape: `<div class="prism" style="--h:${h.toFixed(2)}px">${faces.map((c, i) => `<div class="pface" style="--c:${c.hex};--ink:${ink(c.hex)};font-size:${fs}px;transform:rotateX(${(i * step).toFixed(3)}deg) translateZ(${apo.toFixed(2)}px)"><span>${esc(c.label)}</span></div>`).join('')}</div>`,
    from: 'rotateX(0deg)', to: `rotateX(${-(turns * 360 + k * step)}deg)`
  };
}
const lockLine = entry => `<div class="lockline">🔒 Locked & recorded — audit entry #${entry.seq} · ${fmtTs(entry.ts)} · hash ${entry.hash.slice(0, 16)}…</div>`;
/* Shared dice modal: spins `shape` from → to, then shows the result. Resolves when closed. */
function spinModal({ head, shape, from, to, wide, caption, status, resultHtml, confettiColours }) {
  return new Promise(resolve => {
    openModal(`<div class="roll-modal">${head}
      <div class="stage"><div class="dshadow ${wide ? 'wide' : ''}"></div><div class="hop">${shape}</div></div>
      <div class="muted sm">${caption}</div>
      <div class="rstatus rolling">ROLLING</div><div class="rv"></div></div>`, {
      dismissable: false,
      onMount: (m, close) => {
        const dice = m.querySelector('.dice, .prism'), hop = m.querySelector('.hop');
        dice.style.transition = 'none';
        dice.style.transform = from;
        void dice.offsetWidth;
        requestAnimationFrame(() => {
          dice.style.transition = '';
          hop.classList.add('go');
          dice.style.transform = to;
        });
        setTimeout(() => {
          const st = m.querySelector('.rstatus'); st.classList.remove('rolling'); st.textContent = status;
          m.querySelector('.rv').innerHTML = `${resultHtml}<button class="btn primary" data-close>Close</button>`;
          m.querySelector('[data-close]').onclick = () => { close(); resolve(); };
          if (confettiColours) confetti(confettiColours);
        }, 3150);
      }
    });
  });
}

function animateRoll(e, s, sb, attempt, k, entry, total = ATTEMPTS) {
  const N = sb.colours.length, isFinal = attempt === total, colour = sb.colours[k];
  // Exactly 6 colours → classic Ludo cube (one face per colour). Any other count → N-sided rolling
  // prism ("long dice"), so every colour of the subject is on exactly one face.
  const useCube = N === 6;
  let shape, from, to;
  if (useCube) {
    const faces = [colour, ...sb.colours.filter((_, i) => i !== k).sort(() => Math.random() - .5)];
    shape = `<div class="dice">${faces.map((c, i) => faceHtml(i + 1, c)).join('')}</div>`;
    const tx = 360 * (3 + Math.floor(Math.random() * 2)), ty = 360 * (2 + Math.floor(Math.random() * 2));
    from = 'rotateX(-110deg) rotateY(150deg) rotateZ(35deg)'; to = `rotateX(${-tx}deg) rotateY(${ty}deg) rotateZ(360deg)`;
  } else ({ shape, from, to } = prismShape(sb.colours.map(c => ({ hex: c.hex, label: c.name })), k));
  return spinModal({
    head: `<div class="eyebrow">${esc(e.name)} · ${esc(s.name)}</div><h3>${esc(sb.name)} — ${attemptLabel(attempt, total)}</h3>`,
    shape, from, to, wide: !useCube, caption: `${useCube ? 'Ludo dice' : `${N}-sided dice`} · one face per colour`, status: isFinal ? '' : 'RESULT',
    resultHtml: `${isFinal ? '<div class="finalbanner">★ FINAL QUESTION PAPER COLOUR ★</div>' : ''}
      <div class="result ${isFinal ? 'final' : ''}" style="--c:${colour.hex}"><div class="bsw"></div><div><div class="muted sm">${isFinal ? 'Final selected colour' : 'Selected colour'}</div><div class="rname">${esc(colour.name)}</div></div></div>
      ${lockLine(entry)}`,
    confettiColours: isFinal ? [colour.hex, '#c9a227', '#0b2a5b', '#e6c65a', ...sb.colours.map(c => c.hex)] : null
  });
}

/* Mode B: dice with one face per possible final iteration (3rd–7th) */
function animateFinalIteration(e, s, pool, k, entry) {
  const shades = ['#0b2a5b', '#c9a227', '#123a7a', '#e6c65a', '#8a6d0f', '#1d4ed8', '#facc15'];
  const n = pool[k], label = ORD[n - 1];
  const { shape, from, to } = prismShape(pool.map((x, i) => ({ hex: shades[i % shades.length], label: ORD[x - 1] })), k);
  return spinModal({
    head: `<div class="eyebrow">${esc(e.name)} · ${esc(e.code)}</div><h3>Final iteration draw</h3>`,
    shape, from, to, wide: true, caption: `${pool.length}-sided dice · one face per possible final iteration`, status: '',
    resultHtml: `<div class="finalbanner">★ FINAL ITERATION ★</div>
      <div class="result final" style="--c:#c9a227"><div class="bsw" style="display:grid;place-items:center;font-size:28px;font-weight:800;color:#2a1f00">${n}</div>
        <div><div class="muted sm">Final iteration</div><div class="rname">${label} attempt</div><div class="muted sm">Every subject in every shift gets ${n} attempts. The ${label} gives the final question paper colour.</div></div></div>
      ${lockLine(entry)}`,
    confettiColours: null
  });
}

function confetti(colours) {
  const c = $('#confetti'); c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const ctx = c.getContext('2d');
  const parts = Array.from({ length: 260 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight / 2 - 60, vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 5, s: Math.random() * 8 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colours[Math.floor(Math.random() * colours.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.strokeRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
  })(t0);
}

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  $('#ver').textContent = 'Version ' + APP_VERSION;
  tickClock();
  if (!window.indexedDB || !window.crypto || !crypto.subtle) { app.innerHTML = '<div class="empty">This browser does not support the required secure storage/cryptography. Please use the latest Google Chrome or Microsoft Edge.</div>'; return; }
  db = await openDB();
  try { navigator.storage && navigator.storage.persist && await navigator.storage.persist(); } catch {}
  await installId();
  await renderHeader();
  if (HAS_SERVER && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (session && session.role === 'admin' && session.token) return renderAdmin();
  if (session && session.role === 'approver' && session.token) return renderApprover();
  if (session && session.role === 'client' && (await cachedLogins())[session.user]) { await checkClock('reload'); const x = await verifyChain('client'); integrityIssue = x.ok ? null : x.issues[0]; renderBanners(); return renderClient(); }
  setSession(null); renderLanding();
})().catch(err => { app.innerHTML = `<div class="empty">Failed to start: ${esc(err.message)}</div>`; });
</script>
</body>
