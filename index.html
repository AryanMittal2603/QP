<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPESSC QP Randomization</title>
<style>
:root{
  --navy:#0b2a5b; --navy2:#123a7a; --gold:#c9a227; --gold2:#e6c65a;
  --bg:#f2f4f8; --card:#fff; --ink:#1b2333; --muted:#5b6578; --line:#dde2ea;
  --ok:#067647; --okbg:#e7f6ee; --warn:#b54708; --warnbg:#fff4e5; --bad:#b42318; --badbg:#fdecea; --info:#1d4ed8; --infobg:#e8effd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--gold)}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--navy);font-weight:800;font-size:12px;border:2px solid var(--gold)}
.logo img{width:100%;height:100%;object-fit:contain}
.htitle{flex:1;min-width:0}
.htitle .t1{font-weight:700;font-size:17px;letter-spacing:.2px}
.htitle .t2{font-size:12.5px;opacity:.85}
.hmeta{text-align:right;font-size:12.5px;line-height:1.5}
.hmeta .clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.net{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600}
.net.off{background:#d1fadf;color:#05603a}.net.on{background:#fee4e2;color:#912018}
#banners .banner{padding:9px 20px;font-weight:600;font-size:13px;border-bottom:1px solid rgba(0,0,0,.06)}
.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}
main{max-width:1280px;margin:0 auto;padding:20px}
h2{margin:0;font-size:20px}h3{margin:0 0 4px;font-size:16px}h4{margin:0;font-size:15px}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card.click:hover{border-color:var(--navy2);box-shadow:0 4px 14px rgba(11,42,91,.10)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-cards .card{margin:0}
.row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:200px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f6f7fa}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy2)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#a8861b;color:#2a1f00}
.btn.danger{color:var(--bad);border-color:#f3c3be}.btn.danger:hover{background:var(--badbg)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:var(--navy);color:#fff}
.empty{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:10px;background:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.b-open{background:var(--okbg);color:var(--ok)}.b-up{background:var(--infobg);color:var(--info)}.b-closed{background:#eef0f3;color:#475467}
.b-lock{background:var(--navy);color:#fff}.b-prog{background:var(--warnbg);color:var(--warn)}
table.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f8f9fb}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw-mini{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border:1px solid var(--line);border-radius:12px;font-size:12px;background:#fff}
.sw-mini i{width:14px;height:14px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.2)}
/* randomization grid */
.rgrid-wrap{overflow-x:auto}
table.rgrid{width:100%;border-collapse:separate;border-spacing:0;min-width:980px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rgrid th{background:var(--navy);color:#fff;font-size:12.5px;padding:10px;text-align:center;font-weight:600}
.rgrid th:first-child{text-align:left}
.rgrid th.final{background:#8a6d0f}
.rgrid td{border-top:1px solid var(--line);padding:10px;text-align:center;vertical-align:middle}
.rgrid td.subj{text-align:left;min-width:220px}
.rgrid td.final{background:#fffbea}
.cell.pending{color:#b3b9c5}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:9px;border:1px solid var(--line);background:#fff;text-align:left}
.chip .sw{width:26px;height:26px;border-radius:6px;background:var(--c);border:1px solid rgba(0,0,0,.2);flex:none}
.chip b{display:block;font-size:13px}.chip small{display:block;color:var(--muted);font-size:11px}
.chip svg{width:14px;height:14px;color:var(--muted)}
td.final .chip{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.ts{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.notice{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500}
.notice.ok{background:var(--okbg);color:var(--ok)}.notice.info{background:var(--infobg);color:var(--info)}.notice.warn{background:var(--warnbg);color:var(--warn)}.notice.lock{background:var(--navy);color:#fff}
/* forms & modals */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(720px,100%)}
.form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-weight:600;font-size:13px}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid #c9d0db;border-radius:7px;background:#fff}
.fld input:focus,.fld textarea:focus{outline:2px solid #9db7e8;border-color:var(--navy2)}
.fld .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.err{background:var(--badbg);color:var(--bad);padding:8px 12px;border-radius:7px;font-weight:600}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.presets button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px 3px 4px;cursor:pointer;font-size:12.5px}
.presets button i{width:14px;height:14px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.25)}
.crow{display:grid;grid-template-columns:44px 1fr 120px 34px;gap:8px;align-items:center;margin-bottom:6px}
.crow input[type=color]{width:44px;height:34px;padding:2px;border:1px solid #c9d0db;border-radius:7px}
.crow input[type=text]{padding:7px 9px;border:1px solid #c9d0db;border-radius:7px}
.crow button{border:1px solid #f3c3be;color:var(--bad);background:#fff;border-radius:7px;height:34px;cursor:pointer}
.auth{max-width:420px;margin:40px auto}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:860px;margin:30px auto}
.mode-cards .card{padding:26px;text-align:center}
.mode-cards .ic{font-size:40px;margin-bottom:6px}
.log-table td{font-size:12.5px}
.log-table td.det{max-width:520px;word-break:break-word;color:#344054}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 18px;border-radius:8px;z-index:90;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* dice */
.roll-modal{text-align:center}
.stage{height:250px;display:flex;align-items:flex-end;justify-content:center;perspective:800px;position:relative;margin:6px 0}
.hop{margin-bottom:46px;transform-style:preserve-3d}
.hop.go{animation:hop 3s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes hop{0%{transform:translateY(-150px)}22%{transform:translateY(0)}38%{transform:translateY(-70px)}54%{transform:translateY(0)}67%{transform:translateY(-26px)}78%{transform:translateY(0)}87%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.dshadow{position:absolute;bottom:26px;left:50%;width:120px;height:18px;margin-left:-60px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%)}
.dice{width:120px;height:120px;position:relative;transform-style:preserve-3d;transition:transform 3s cubic-bezier(.15,.65,.2,1)}
.face{position:absolute;inset:0;border-radius:20px;background:var(--c);border:3px solid rgba(0,0,0,.18);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-shadow:inset 0 0 22px rgba(0,0,0,.22),inset 0 6px 10px rgba(255,255,255,.35)}
.face i{display:block;margin:auto;width:17px;height:17px;border-radius:50%}
.face i.p{background:var(--ink);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.f1{transform:translateZ(60px)}.f2{transform:rotateY(180deg) translateZ(60px)}.f3{transform:rotateY(90deg) translateZ(60px)}
.f4{transform:rotateY(-90deg) translateZ(60px)}.f5{transform:rotateX(90deg) translateZ(60px)}.f6{transform:rotateX(-90deg) translateZ(60px)}
.prism{width:170px;height:184px;position:relative;transform-style:preserve-3d;transition:transform 3s cubic-bezier(.15,.65,.2,1)}
.pface{position:absolute;left:0;top:50%;width:170px;height:var(--h);margin-top:calc(var(--h) / -2);background:var(--c);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border:2px solid rgba(0,0,0,.2);border-radius:6px;box-shadow:inset 0 0 18px rgba(0,0,0,.22),inset 0 4px 8px rgba(255,255,255,.3);overflow:hidden}
.pface small{font-size:.6em;font-weight:600;opacity:.8;text-transform:none}
.dshadow.wide{width:190px;margin-left:-95px}
.rstatus{font-weight:700;color:var(--muted);letter-spacing:.5px;min-height:22px}
.rstatus.rolling::after{content:"";animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.result{display:flex;align-items:center;gap:16px;justify-content:center;margin:10px auto 6px;padding:14px 20px;border-radius:12px;border:2px solid var(--c);max-width:420px;animation:glow 1.6s ease-in-out infinite;text-align:left}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 28px 8px color-mix(in srgb,var(--c) 45%,transparent)}}
.result .bsw{width:58px;height:58px;border-radius:12px;background:var(--c);border:2px solid rgba(0,0,0,.2);flex:none}
.result .rname{font-size:28px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.result.final{border-color:var(--gold);background:#fffbea}
.finalbanner{font-weight:800;color:#8a6d0f;letter-spacing:2px;font-size:13px;margin-top:4px}
.lockline{font-size:12.5px;color:var(--ok);font-weight:600;margin:8px 0 12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}
@media (max-width:720px){.mode-cards,.two,.three{grid-template-columns:1fr}header{flex-wrap:wrap}.hmeta{text-align:left}}
@media print{header,.tabs,.toolbar,.btn{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">UPESSC</div>
  <div class="htitle">
    <div class="t1">Uttar Pradesh Education Service Selection Commission</div>
    <div class="t2">Question Paper Randomization System</div>
  </div>
  <div class="hmeta">
    <div class="clock" id="clock">--</div>
    <div><span id="net" class="net off">Offline</span> <span id="who"></span></div>
  </div>
</header>
<div id="banners"></div>
<main id="app"></main>
<div id="modalRoot"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* =========================================================
   Utilities
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const enc = new TextEncoder();
const ITER = 150000;
const ATTEMPTS = 5;
const ATTEMPT_LABELS = ['1st Attempt', '2nd Attempt', '3rd Attempt', '4th Attempt', 'Final (5th)'];
const PRESETS = [['Red','#d92d20'],['Blue','#1d4ed8'],['Green','#16a34a'],['Yellow','#facc15'],['Pink','#ec4899'],['Orange','#f97316'],['Purple','#7e22ce'],['White','#ffffff'],['Grey','#6b7280'],['Brown','#8b5a2b'],['Sky Blue','#38bdf8'],['Maroon','#7f1d1d']];
const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const uid = () => hex(crypto.getRandomValues(new Uint8Array(8)));
function b64(buf) { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function sha256(str) { return hex(await crypto.subtle.digest('SHA-256', enc.encode(str))); }
function stable(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
async function pbkdf2(pw, salt) {
  const k = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, k, 256);
}
async function hashPw(pw, saltB64) { return b64(await pbkdf2(pw, unb64(saltB64))); }
async function makeCred(username, pw) { const salt = b64(crypto.getRandomValues(new Uint8Array(16))); return { username, salt, hash: await hashPw(pw, salt) }; }
async function aesKey(pw, salt) { return crypto.subtle.importKey('raw', await pbkdf2(pw, salt), 'AES-GCM', false, ['encrypt', 'decrypt']); }
/* Unbiased cryptographic integer in [0, n) using rejection sampling */
function secureRandomInt(n) {
  const limit = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1); let x, tries = 0;
  do { crypto.getRandomValues(a); x = a[0]; tries++; } while (x >= limit);
  return { value: x % n, raw: x, tries };
}
function fmtTs(t) { if (!t) return '—'; const d = new Date(t); return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const fmtTime = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtDate = s => { const [y, m, d] = s.split('-'); return `${d}-${m}-${y}`; };
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
const safeName = s => String(s).replace(/[^A-Za-z0-9_-]+/g, '_');
function ink(h) { const n = parseInt(h.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299*r + 0.587*g + 0.114*b) > 160 ? '#1b2333' : '#ffffff'; }
function download(name, text, type = 'application/json') {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCsv = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function bind(root, actions) { root.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', e => { const f = actions[el.dataset.act]; if (f) { e.stopPropagation(); f(el.dataset, e); } })); }
const swMini = c => `<span class="sw-mini" style="--c:${c.hex}"><i></i>${esc(c.name)}${c.set ? ` <span class="muted">(${esc(c.set)})</span>` : ''}</span>`;

/* ---------- Server API (Vercel + Neon). Unavailable when opened as a local file or offline. ---------- */
const HAS_SERVER = location.protocol.startsWith('http');
async function api(path, { method = 'GET', body, token } = {}) {
  if (!HAS_SERVER) { const e = new Error('Server not available (page opened as a local file).'); e.network = true; throw e; }
  const t = token !== undefined ? token : session && session.token;
  let r;
  try { r = await fetch('/api/' + path, { method, cache: 'no-store', headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: 'Bearer ' + t } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch { const e = new Error('Server not reachable. Check the internet connection.'); e.network = true; throw e; }
  const j = await r.json().catch(() => ({ error: 'Unexpected server response.' }));
  if (!r.ok) {
    if (r.status === 401 && session && session.role === 'admin' && path !== 'admin/login') { setSession(null); renderAdminAuth(); }
    const e = new Error(j.error || 'Request failed.'); e.status = r.status; throw e;
  }
  return j;
}
async function apiOrAlert(path, opts) { try { return await api(path, opts); } catch (e) { await alertModal('Action failed', `<p style="white-space:pre-line">${esc(e.message)}</p>`); return null; } }

/* =========================================================
   IndexedDB storage
   ========================================================= */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('upessc_qpr_v1', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('meta');
      d.createObjectStore('admin_exams', { keyPath: 'id' });
      d.createObjectStore('admin_log', { keyPath: 'seq' });
      d.createObjectStore('client_exams', { keyPath: 'id' });
      d.createObjectStore('draws', { keyPath: 'key' });
      d.createObjectStore('client_log', { keyPath: 'seq' });
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function reqP(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idb = {
  get: (st, k) => reqP(st, 'readonly', s => s.get(k)),
  all: st => reqP(st, 'readonly', s => s.getAll()),
  put: (st, v, k) => reqP(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)),
  del: (st, k) => reqP(st, 'readwrite', s => s.delete(k)),
};
function lastEntry(store) {
  return new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).openCursor(null, 'prev'); r.onsuccess = () => res(r.result ? r.result.value : null); r.onerror = () => rej(r.error); });
}

/* =========================================================
   Hash-chained audit log
   Each entry: hash = SHA-256( stable-JSON(entry without "hash") ), prevHash links to previous entry.
   ========================================================= */
let logQueue = Promise.resolve();
function appendLog(scope, event, details = {}, opts = {}) {
  const run = async () => {
    const store = scope + '_log';
    const last = await lastEntry(store);
    const now = Date.now();
    const entry = {
      seq: last ? last.seq + 1 : 1, ts: now, time: new Date(now).toISOString(), localTime: fmtTs(now),
      actor: opts.actor || (session && session.user) || 'system', console: scope, event,
      details: JSON.parse(JSON.stringify(details)), prevHash: last ? last.hash : 'GENESIS'
    };
    entry.hash = await sha256(stable(entry));
    const extra = opts.extra ? opts.extra(entry) : null;
    await new Promise((res, rej) => {
      const stores = [store, 'meta']; if (extra) stores.push(extra.store);
      const t = db.transaction(stores, 'readwrite');
      t.objectStore(store).add(entry);
      t.objectStore('meta').put({ seq: entry.seq, hash: entry.hash }, scope + '_head');
      if (extra) t.objectStore(extra.store).add(extra.value);   // add() refuses to overwrite → immutability
      t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction aborted'));
    });
    return entry;
  };

}
async function verifyEntries(entries) {
  const issues = []; let prev = 'GENESIS';
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.seq !== i + 1) issues.push(`Sequence gap at entry #${e.seq}`);
    if (e.prevHash !== prev) issues.push(`Broken chain link at entry #${e.seq}`);
    const { hash, ...rest } = e;
    if (await sha256(stable(rest)) !== hash) issues.push(`Entry #${e.seq} has been altered`);
    prev = hash;
  }
  return { ok: !issues.length, issues, count: entries.length, head: prev };
}
async function verifyChain(scope) {
  const entries = (await idb.all(scope + '_log')).sort((a, b) => a.seq - b.seq);
  const base = await verifyEntries(entries), issues = base.issues, prev = base.head;
  const head = await idb.get('meta', scope + '_head');
  const last = entries[entries.length - 1];
  if (head && (!last || head.seq !== last.seq || head.hash !== last.hash)) issues.push('Latest log entries are missing (chain head mismatch)');
  if (scope === 'client') {
    const draws = await idb.all('draws'); const bySeq = new Map(entries.map(e => [e.seq, e]));
    for (const d of draws) {
      const e = bySeq.get(d.logSeq);
      if (!e || e.event !== 'RANDOMIZATION_DRAW' || e.details.key !== d.key || e.details.colourIndex !== d.colourIndex || e.hash !== d.logHash) issues.push(`Draw ${d.subjectName} / ${ATTEMPT_LABELS[d.attempt-1]} does not match the audit log`);
    }
    const keys = new Set(draws.map(d => d.key));
    entries.filter(e => e.event === 'RANDOMIZATION_DRAW' && !keys.has(e.details.key)).forEach(e => issues.push(`Draw record for log entry #${e.seq} is missing`));
  }
  return { ok: !issues.length, issues, count: entries.length, head: prev, entries };
}

/* PC clock is the source of truth; flag any backwards movement */
async function checkClock(context, scope = 'client') {
  const now = Date.now(); const key = scope + '_clock';
  const m = (await idb.get('meta', key)) || { lastSeen: 0, flags: 0 };
  let flagged = false;
  if (m.lastSeen && now < m.lastSeen - 2000) {
    flagged = true; m.flags = (m.flags || 0) + 1;
    await appendLog(scope, 'CLOCK_BACKWARDS_FLAG', { context, currentClock: new Date(now).toISOString(), currentLocal: fmtTs(now), lastSeenClock: new Date(m.lastSeen).toISOString(), lastSeenLocal: fmtTs(m.lastSeen), backwardsBySeconds: Math.round((m.lastSeen - now) / 1000) });
  }
  m.lastSeen = Math.max(now, m.lastSeen || 0);
  await idb.put('meta', m, key);
  if (flagged) renderBanners();
  return flagged;
}
function tickClock() {
  $('#clock').textContent = fmtTs(Date.now());
  const n = $('#net'); n.className = 'net ' + (navigator.onLine ? 'on' : 'off'); n.textContent = navigator.onLine ? 'Network: CONNECTED' : 'Offline ✓';
}

   ========================================================= */
function openModal(html, { wide = false, dismissable = true, onDismiss, onMount } = {}) {
  const wrap = document.createElement('div'); wrap.className = 'overlay';
  wrap.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  $('#modalRoot').appendChild(wrap);
  const close = () => wrap.remove();
  if (dismissable) wrap.addEventListener('mousedown', e => { if (e.target === wrap) { close(); onDismiss && onDismiss(); } });
  onMount && onMount(wrap.firstElementChild, close);
  return close;
}
function alertModal(title, html) {
  return new Promise(r => openModal(`<h3>${esc(title)}</h3><div style="margin:10px 0 16px">${html}</div><div class="actions"><button class="btn primary" data-ok>OK</button></div>`,
    { onDismiss: r, onMount: (m, close) => { m.querySelector('[data-ok]').onclick = () => { close(); r(); }; } }));
}
function confirmModal(title, html, okLabel = 'Confirm', cls = 'primary') {
  return new Promise(r => openModal(`<h3>${esc(title)}</h3><div style="margin:10px 0 16px">${html}</div><div class="actions"><button class="btn ghost" data-no>Cancel</button><button class="btn ${cls}" data-ok>${esc(okLabel)}</button></div>`,
    { onDismiss: () => r(false), onMount: (m, close) => { m.querySelector('[data-no]').onclick = () => { close(); r(false); }; m.querySelector('[data-ok]').onclick = () => { close(); r(true); }; } }));
}
function fieldHtml(f) {
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  if (f.type === 'colours') return `<div class="fld"><span>${esc(f.label)}</span>${hint}<div data-colours="${f.name}"></div></div>`;
  if (f.type === 'textarea') return `<label class="fld"><span>${esc(f.label)}</span><textarea name="${f.name}" rows="2">${esc(f.value || '')}</textarea>${hint}</label>`;
  return `<label class="fld"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type || 'text'}" ${f.accept ? `accept="${f.accept}"` : ''} value="${f.type === 'file' ? '' : esc(f.value || '')}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off">${hint}</label>`;
}
function formModal(title, fields, { submitLabel = 'Save', validate, intro = '' } = {}) {
  return new Promise(resolve => {
    const groups = []; // allow {row:[...]} to place fields side by side
    const html = `<h3>${esc(title)}</h3>${intro}<form class="form" novalidate>${fields.map(f => f.row ? `<div class="${f.row.length === 3 ? 'three' : 'two'}">${f.row.map(fieldHtml).join('')}</div>` : fieldHtml(f)).join('')}
      <div class="err" hidden></div><div class="actions"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn primary" type="submit">${esc(submitLabel)}</button></div></form>`;
    const flat = fields.flatMap(f => f.row || [f]);
    openModal(html, {
      wide: flat.some(f => f.type === 'colours'), onDismiss: () => resolve(null),
      onMount: (m, close) => {
        const form = m.querySelector('form'), errEl = m.querySelector('.err');
        flat.filter(f => f.type === 'colours').forEach(f => mountColours(m.querySelector(`[data-colours="${f.name}"]`), f.value || []));
        m.querySelector('[data-cancel]').onclick = () => { close(); resolve(null); };
        const first = form.querySelector('input,textarea'); first && first.focus();
        form.onsubmit = async e => {
          e.preventDefault(); errEl.hidden = true;
          const vals = {};
          for (const f of flat) {
            if (f.type === 'colours') vals[f.name] = readColours(m.querySelector(`[data-colours="${f.name}"]`));
            else if (f.type === 'file') vals[f.name] = form.elements[f.name].files[0] || null;
            else vals[f.name] = form.elements[f.name].value.trim();
            if (f.required && !vals[f.name]) { errEl.textContent = `${f.label} is required.`; errEl.hidden = false; return; }
          }
          const btn = form.querySelector('[type=submit]'); btn.disabled = true;
          try { const msg = validate ? await validate(vals) : null; if (msg) { errEl.textContent = msg; errEl.hidden = false; btn.disabled = false; return; } }
          catch (err) { errEl.textContent = err.message; errEl.hidden = false; btn.disabled = false; return; }
          close(); resolve(vals);
        };
      }
    });
  });
}
function mountColours(el, initial) {
  let rows = initial.map(c => ({ ...c }));
  const nextSet = () => { const used = new Set(rows.map(r => r.set)); for (let i = 0; i < 26; i++) { const s = 'Set ' + String.fromCharCode(65 + i); if (!used.has(s)) return s; } return ''; };
  const sync = () => { rows = readColours(el); };
  const render = () => {
    el.innerHTML = `<div class="presets">${PRESETS.map(([n, h]) => `<button type="button" data-p="${n}" style="--c:${h}"><i></i>${n}</button>`).join('')}<button type="button" data-custom>+ Custom</button></div>
      ${rows.length ? `<div class="crow muted sm"><span>Colour</span><span>Colour name</span><span>Set code</span><span></span></div>` : '<div class="muted sm">Click a preset colour above to add question-paper sets.</div>'}
      ${rows.map((r, i) => `<div class="crow"><input type="color" value="${r.hex}"><input type="text" data-n value="${esc(r.name)}" placeholder="e.g. Red"><input type="text" data-s value="${esc(r.set || '')}" placeholder="e.g. Set A"><button type="button" data-rm="${i}" title="Remove">✕</button></div>`).join('')}`;
    el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { sync(); const p = PRESETS.find(x => x[0] === b.dataset.p); if (rows.some(r => r.name.toLowerCase() === p[0].toLowerCase())) return toast(`${p[0]} is already added`); rows.push({ name: p[0], hex: p[1], set: nextSet() }); render(); });
    el.querySelector('[data-custom]').onclick = () => { sync(); rows.push({ name: '', hex: '#888888', set: nextSet() }); render(); el.querySelectorAll('[data-n]')[rows.length - 1].focus(); };
    el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); rows.splice(+b.dataset.rm, 1); render(); });
  };
  render();
}
function readColours(el) {
  return [...el.querySelectorAll('.crow')].filter(r => r.querySelector('[type=color]')).map(r => ({ hex: r.querySelector('[type=color]').value, name: r.querySelector('[data-n]').value.trim(), set: r.querySelector('[data-s]').value.trim() }));
}

/* Offline backup path: publishes, then downloads the same version as an encrypted file */
async function exportPackage(e) {
  const { clientCred: cred, logo } = await api('admin/settings');
  if (!cred) return alertModal('Cannot export yet', '<p>Set the Randomization Console login in Settings first.</p>');
  const r = await formModal('Download encrypted offline package', [{ name: 'pw', label: `Password of Randomization login "${cred.username}"`, type: 'password', required: true, hint: 'Use this only for a PC that cannot go online even once. The exam is published, and the same version is encrypted (AES-256-GCM) with this password.' }],
    { submitLabel: 'Publish, encrypt & download', validate: async v2 => (await hashPw(v2.pw, cred.salt)) === cred.hash ? null : 'Password does not match the configured Randomization login.' });
  if (!r) return;
  const pub = await apiOrAlert('admin/publish', { method: 'POST', body: { id: e.id } }); if (!pub) return;
  const version = pub.publishedVersion;
  const { publishedVersion, publishedAt, changedSincePublish, ...examData } = e;
  const payload = { format: 'UPESSC-QPR-PAYLOAD', version: 1, packageVersion: version, exportedAt: new Date().toISOString(), exportedBy: session.user, adminInstallId: 'server',
    client: cred, logo: logo || null, exam: examData };
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(r.pw, salt), enc.encode(JSON.stringify(payload)));
  const data = b64(ct);
  const pkg = { format: 'UPESSC-QPR-PACKAGE', version: 1, examCode: e.code, packageVersion: version, createdAt: payload.exportedAt, kdf: { name: 'PBKDF2-SHA256', iterations: ITER }, cipher: 'AES-256-GCM', salt: b64(salt), iv: b64(iv), data, sha256: await sha256(data) };
  download(`UPESSC_${safeName(e.code)}_package_v${version}_${stamp()}.qpr`, JSON.stringify(pkg));
  await api('admin/package-logged', { method: 'POST', body: { examId: e.id, examCode: e.code, packageVersion: version, packageSha256: pkg.sha256 } }).catch(() => {});
  toast(`Package v${version} downloaded`); renderAdmin();
}

/* =========================================================
   RANDOMIZATION (CLIENT) CONSOLE
   ========================================================= */
const cstate = { view: 'exams', examId: null, shiftId: null };
const dkey = (e, s, b, a) => `${e}|${s}|${b}|${a}`;
function shiftWindow(s) { return { start: new Date(`${s.date}T${s.start}:00`).getTime(), end: new Date(`${s.date}T${s.end}:59.999`).getTime() }; }
function windowState(s, now = Date.now()) { const w = shiftWindow(s); return now < w.start ? 'upcoming' : now > w.end ? 'closed' : 'open'; }
async function drawMap(examId) { const m = new Map(); (await idb.all('draws')).filter(d => d.examId === examId).forEach(d => m.set(d.key, d)); return m; }
function shiftProgress(e, s, D) { let done = 0, total = s.subjects.length * ATTEMPTS; s.subjects.forEach(sb => { for (let a = 1; a <= ATTEMPTS; a++) if (D.has(dkey(e.id, s.id, sb.id, a))) done++; }); return { done, total, complete: total > 0 && done === total }; }
function stateBadge(s, prog) {
  if (prog.complete) return '<span class="badge b-lock">🔒 LOCKED</span>';
  const w = windowState(s);
  return (w === 'open' ? '<span class="badge b-open">● Window open</span>' : w === 'upcoming' ? '<span class="badge b-up">Upcoming</span>' : '<span class="badge b-closed">Window closed</span>') + (prog.done ? ` <span class="badge b-prog">${prog.done}/${prog.total} draws</span>` : '');
}

    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn sm" data-act="imp">⬆ Import offline package (.qpr)</button></div>`;
  bind(app, { back: renderLanding, imp: async () => { if (await importPackageFlow()) renderClientAuth(); } });
  const f = $('#lf'); f.u.focus();
  f.onsubmit = async e => {
    e.preventDefault(); const u = f.u.value.trim(), p = f.p.value, er = f.querySelector('.err'), btn = f.querySelector('.btn.primary');
    const showErr = m => { er.textContent = m; er.hidden = false; btn.disabled = false; };
    btn.disabled = true;
    let online = null;
    try { online = await api('client/login', { method: 'POST', token: null, body: { username: u, password: p, installId: await installId(), clientClock: new Date().toISOString() } }); }
    catch (err) {
      if (!err.network) { await appendLog('client', 'CLIENT_LOGIN_FAILED', { attemptedUsername: u, mode: 'online', reason: err.message }, { actor: u || 'unknown' }); return showErr(err.message); }
    }
    let mode = 'online';
    if (online) {
      await idb.put('meta', online.cred, 'client_auth');
      await idb.put('meta', online.token, 'client_token');
      online.logo ? await idb.put('meta', online.logo, 'logo') : await idb.del('meta', 'logo');
    } else {
      mode = 'offline';
      const a = await idb.get('meta', 'client_auth');
      if (!a) return showErr('Server not reachable and this PC has no cached login. Connect to the internet for the first login, or import an offline package.');
      if (!(u === a.username && await hashPw(p, a.salt) === a.hash)) { await appendLog('client', 'CLIENT_LOGIN_FAILED', { attemptedUsername: u, mode }, { actor: u || 'unknown' }); return showErr('Invalid username or password.'); }
    }
    setSession({ role: 'client', user: u });
    await checkClock('login');
    await appendLog('client', 'CLIENT_LOGIN', { mode, clockReading: new Date().toISOString(), localClock: fmtTs(Date.now()), serverClock: online ? new Date(online.serverTime).toISOString() : null,
      clockDriftSeconds: online ? Math.round((Date.now() - online.serverTime) / 1000) : null, timezoneOffsetMinutes: new Date().getTimezoneOffset(), networkOnline: navigator.onLine, installId: await installId(), userAgent: navigator.userAgent });
    if (online) {
      const summary = [];
      for (const ex of online.exams) { const m = await mergeExam(ex, { packageVersion: ex.packageVersion, exportedAt: ex.exportedAt, source: 'online' }); summary.push({ code: ex.code, version: ex.packageVersion, ...m }); }
      await appendLog('client', 'EXAMS_DOWNLOADED', { count: online.exams.length, exams: summary });
      if (Math.abs(Date.now() - online.serverTime) > 120000) await appendLog('client', 'CLOCK_DRIFT_FLAG', { pcClock: new Date().toISOString(), serverClock: new Date(online.serverTime).toISOString(), driftSeconds: Math.round((Date.now() - online.serverTime) / 1000) });
    }
    const x = await verifyChain('client');
    integrityIssue = x.ok ? null : x.issues[0];
    if (!x.ok) await appendLog('client', 'INTEGRITY_CHECK_FAILED', { issues: x.issues });
    cstate.view = 'exams'; renderHeader(); renderClient();
    if (online) syncNow(true);
  };
}

/* Merge a downloaded/imported exam. In a shift where randomization has started, the time window and
   every subject that already has a draw stay frozen; subjects without draws take the new version. */
async function mergeExam(ex, meta) {
  const existing = await idb.get('client_exams', ex.id);
  if (existing && existing.packageVersion > meta.packageVersion) return { skipped: `newer v${existing.packageVersion} already present` };
  const draws = (await idb.all('draws')).filter(d => d.examId === ex.id);
  const startedShifts = new Set(draws.map(d => d.shiftId)), drawnSubjects = new Set(draws.map(d => d.shiftId + '|' + d.subjectId));
  const updated = [], keptLocked = [];
  const mergeShift = (s, old) => {
    if (!old || !startedShifts.has(s.id)) { updated.push(s.name); return s; }
    const subjects = s.subjects.map(b => {
      const ob = old.subjects.find(x => x.id === b.id);
      if (ob && drawnSubjects.has(s.id + '|' + b.id)) { keptLocked.push(`${old.name} / ${ob.name}`); return ob; }
      updated.push(`${old.name} / ${b.name}`); return b;
    });
    old.subjects.forEach(ob => { if (drawnSubjects.has(s.id + '|' + ob.id) && !subjects.some(b => b.id === ob.id)) { subjects.push(ob); keptLocked.push(`${old.name} / ${ob.name}`); } });
    if (s.date !== old.date || s.start !== old.start || s.end !== old.end) keptLocked.push(`${old.name} time window`);
    return { ...s, name: old.name, date: old.date, start: old.start, end: old.end, subjects };
  };
  const shifts = ex.shifts.map(s => mergeShift(s, existing && existing.shifts.find(o => o.id === s.id)));
  if (existing) existing.shifts.forEach(o => { if (startedShifts.has(o.id) && !shifts.some(s => s.id === o.id)) { shifts.push(o); keptLocked.push(o.name); } });
  const { packageVersion, exportedAt, ...doc } = ex;
  await idb.put('client_exams', { ...doc, shifts, ...meta, importedAt: Date.now() });
  return { updated, keptLocked };
}

/* Upload the local audit chain + draws to the server (append-only on the server side) */
let syncing = false;
async function syncNow(auto = false) {
  if (syncing || !HAS_SERVER || !navigator.onLine) { if (!auto) toast(navigator.onLine ? 'Sync already running' : 'Offline — results will sync when the PC is back online'); return; }
  const token = await idb.get('meta', 'client_token');
  if (!token) { if (!auto) toast('Log in online once to enable sync'); return; }
  syncing = true;
  try {
    const entries = (await idb.all('client_log')).sort((a, b) => a.seq - b.seq), draws = await idb.all('draws');
    const r = await api('client/sync', { method: 'POST', token, body: { installId: await installId(), entries, draws } });
    await idb.put('meta', { at: Date.now(), upToSeq: entries.length ? entries[entries.length - 1].seq : 0, draws: r.draws, ok: r.ok, conflicts: r.conflicts }, 'last_sync');
    await appendLog('client', 'SYNC_COMPLETED', { upToSeq: entries.length ? entries[entries.length - 1].seq : 0, entries: r.entries, draws: r.draws, serverChainOk: r.chainOk, conflicts: r.conflicts });
    if (!auto || !r.ok) toast(r.ok ? `Synced ✔ ${r.draws} draw(s), ${r.entries} log entries` : 'Synced with conflicts. See server results.');
  } catch (err) {
    await appendLog('client', 'SYNC_FAILED', { reason: err.message });
    if (!auto) toast('Sync failed: ' + err.message);
    if (err.status === 401) await idb.del('meta', 'client_token');
  } finally { syncing = false; if (session && session.role === 'client' && !busy && !$('#modalRoot').children.length) renderClient(); }
}

async function decryptPackage(file, pw) {
  let pkg; try { pkg = JSON.parse(await file.text()); } catch { throw new Error('This is not a valid exam package file.'); }
  if (pkg.format !== 'UPESSC-QPR-PACKAGE') throw new Error('This is not a UPESSC exam package.');
  if (await sha256(pkg.data) !== pkg.sha256) throw new Error('Package file is corrupted (checksum mismatch).');
  let plain; try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(pkg.iv) }, await aesKey(pw, unb64(pkg.salt)), unb64(pkg.data)); }
  catch { throw new Error('Wrong password, or the package has been modified.'); }
  const payload = JSON.parse(new TextDecoder().decode(plain));
  if (payload.format !== 'UPESSC-QPR-PAYLOAD') throw new Error('Unsupported package content.');
  return { pkg, payload };
}
async function importPackageFlow() {
  let res;
  const r = await formModal('Import offline exam package', [{ name: 'file', label: 'Package file (.qpr)', type: 'file', accept: '.qpr', required: true }, { name: 'pw', label: 'Randomization login password', type: 'password', required: true }],
    { submitLabel: 'Decrypt & import', validate: async v => { try { res = await decryptPackage(v.file, v.pw); } catch (err) { await appendLog('client', 'PACKAGE_IMPORT_FAILED', { file: v.file.name, reason: err.message }); return err.message; }
      const ex = await idb.get('client_exams', res.payload.exam.id);
      if (ex && ex.packageVersion > res.payload.packageVersion) return `A newer version (v${ex.packageVersion}) of this exam is already on this PC.`;
      return null; } });
  if (!r) return false;
  const { pkg, payload } = res, ex = payload.exam;
  const m = await mergeExam(ex, { packageVersion: payload.packageVersion, packageSha256: pkg.sha256, exportedAt: payload.exportedAt, exportedBy: payload.exportedBy, source: 'package' });
  await idb.put('meta', payload.client, 'client_auth');
  if (payload.logo) await idb.put('meta', payload.logo, 'logo');
  await appendLog('client', 'PACKAGE_IMPORTED', { file: r.file.name, examId: ex.id, examName: ex.name, examCode: ex.code, packageVersion: payload.packageVersion, packageSha256: pkg.sha256, exportedAt: payload.exportedAt, exportedBy: payload.exportedBy, ...m, clientUsername: payload.client.username },
    { actor: (session && session.user) || payload.client.username });
  renderHeader();
  await alertModal('Package imported', `<p><b>${esc(ex.name)}</b> (${esc(ex.code)}) — version ${payload.packageVersion}</p><p>Updated: ${m.updated.map(esc).join(', ') || '—'}${m.keptLocked.length ? `<br>Kept unchanged because randomization has already started: ${m.keptLocked.map(esc).join(', ')}` : ''}</p>`);
  return true;
}

async function renderClient() {
  if (!session) return renderLanding();
  const tabs = [['exams', 'Exams'], ['audit', 'Audit Log']];
  const cur = cstate.view === 'audit' ? 'audit' : 'exams';
  const ls = await idb.get('meta', 'last_sync');
  const logs = await lastEntry('client_log');
  const pending = logs && (!ls || logs.seq > ls.upToSeq + 1);
  const syncInfo = ls ? `Last sync ${fmtTs(ls.at)}${pending ? ' · <b>unsynced changes</b>' : ' ✔'}` : 'Not yet synced';
  app.innerHTML = `<div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${cur === k ? 'on' : ''}" data-act="tab" data-k="${k}">${l}</button>`).join('')}<div class="sp"></div>
    <span class="muted sm">${syncInfo}</span><button class="btn sm" data-act="sync" ${navigator.onLine && HAS_SERVER ? '' : 'disabled title="Connect to the internet to sync"'}>⟳ Sync now</button>
    <button class="btn sm" data-act="imp">⬆ Import package</button> <button class="btn sm" data-act="logout">Log out</button></div><div id="view"></div>`;
  bind(app, { tab: d => { cstate.view = d.k; renderClient(); }, logout, sync: () => syncNow(false), imp: async () => { if (await importPackageFlow()) renderClient(); } });
  const v = $('#view');
  if (cstate.view === 'audit') return renderAudit(v, 'client');
  if (cstate.view === 'exam') return renderClientExam(v);
  if (cstate.view === 'shift') return renderShift(v);

}

async function renderShift(v) {
  const e = await idb.get('client_exams', cstate.examId); const s = e && e.shifts.find(x => x.id === cstate.shiftId);
  if (!s) { cstate.view = 'exams'; return renderClient(); }
  const D = await drawMap(e.id), p = shiftProgress(e, s, D), w = windowState(s), canRoll = w === 'open' && !p.complete && !navigator.onLine;
  let note;
  if (p.complete) note = `<div class="notice lock">🔒 This shift is permanently LOCKED. All final sets have been selected. No further changes are possible.</div>`;
  else if (w === 'open' && navigator.onLine) note = `<div class="notice warn">🔌 The randomization window is open, but this PC is CONNECTED to a network. Disconnect the network cable / Wi-Fi to enable the dice. Randomization is only allowed offline.</div>`;
  else if (w === 'open') note = `<div class="notice ok">● Randomization window is OPEN until ${s.end} on ${fmtDate(s.date)}. Each draw is final and is locked immediately.</div>`;
  else if (w === 'upcoming') note = `<div class="notice info">Randomization for this shift opens at <b>${s.start}</b> on <b>${fmtDate(s.date)}</b> (PC clock).</div>`;
  else note = `<div class="notice warn">The randomization window (${s.start} – ${s.end} on ${fmtDate(s.date)}) has closed. Results are view-only.</div>`;
  const cell = (sb, a) => {
    const d = D.get(dkey(e.id, s.id, sb.id, a)); const fin = a === ATTEMPTS ? 'final' : '';
    if (d) return `<td class="${fin}"><div class="chip" style="--c:${d.colour.hex}"><span class="sw"></span><span><b>${esc(d.colour.name)}</b>${d.colour.set ? `<small>${esc(d.colour.set)}</small>` : ''}</span>${LOCK_SVG}</div><div class="ts">${fmtTime(d.ts)} · #${d.logSeq}</div></td>`;
    let next = 1; while (next <= ATTEMPTS && D.has(dkey(e.id, s.id, sb.id, next))) next++;
    if (a === next) return `<td class="${fin}"><button class="btn ${a === ATTEMPTS ? 'gold' : 'primary'}" data-act="roll" data-b="${sb.id}" data-a="${a}" ${canRoll ? '' : 'disabled'}>🎲 ${a === ATTEMPTS ? 'Final roll' : 'Roll'}</button></td>`;
    return `<td class="${fin} pending" style="color:#b3b9c5">—</td>`;
  };
  v.innerHTML = `<div class="toolbar"><button class="btn" data-act="back">← Shifts</button><div class="grow"><div class="eyebrow">${esc(e.name)} · ${esc(e.code)}</div><h2>${esc(s.name)} <span style="font-size:13px">${stateBadge(s, p)}</span></h2></div><div class="sp"></div>
      <button class="btn" data-act="audit">Audit log</button></div>
    ${note}
    <div class="rgrid-wrap"><table class="rgrid"><thead><tr><th>Subject & QP colour sets</th>${ATTEMPT_LABELS.map((l, i) => `<th class="${i === ATTEMPTS - 1 ? 'final' : ''}">${l}</th>`).join('')}</tr></thead>
    <tbody>${s.subjects.map(sb => `<tr><td class="subj"><b>${esc(sb.name)}</b>${sb.code ? ` <span class="muted sm">${esc(sb.code)}</span>` : ''}<div class="swatches" style="margin-top:5px">${sb.colours.map(swMini).join('')}</div></td>${[1, 2, 3, 4, 5].map(a => cell(sb, a)).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted sm" style="margin-top:12px">Every draw uses the browser's cryptographic random number generator (crypto.getRandomValues) with unbiased rejection sampling. Each attempt is an independent draw from all sets of that subject. Results are written to the hash-chained audit log before the animation finishes, so a refresh or power cut cannot alter them.</p>`;
  bind(v, { back: () => { cstate.view = 'exam'; renderClient(); }, audit: () => { cstate.view = 'audit'; renderClient(); }, roll: d => doDraw(e.id, s.id, d.b, +d.a) });
}

/* ---------- the draw ---------- */
const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
const faceHtml = (i, c) => `<div class="face f${i}" style="--c:${c.hex};--ink:${ink(c.hex)}">${[1,2,3,4,5,6,7,8,9].map(p => `<i class="${PIPS[i].includes(p) ? 'p' : ''}"></i>`).join('')}</div>`;

async function doDraw(examId, shiftId, subjectId, attempt) {
  if (busy) return; busy = true;
  try {
    await checkClock('pre-draw');
    const e = await idb.get('client_exams', examId), s = e.shifts.find(x => x.id === shiftId), sb = s.subjects.find(x => x.id === subjectId);
    if (navigator.onLine) { await appendLog('client', 'DRAW_BLOCKED_NETWORK_CONNECTED', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); toast('Disconnect the network to randomize.'); return renderClient(); }
    if (windowState(s) !== 'open') { await appendLog('client', 'DRAW_BLOCKED_OUTSIDE_WINDOW', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); toast('Randomization window is not open (PC clock).'); return renderClient(); }
    const n = sb.colours.length;
    const ok = await confirmModal(`${sb.name} — ${ATTEMPT_LABELS[attempt - 1]}`,
      `<p>${esc(e.name)} · ${esc(s.name)}</p><p>Pool of ${n} colour-coded sets (each has a 1 in ${n} chance):</p><div class="swatches">${sb.colours.map(swMini).join('')}</div>
       <p style="margin-top:12px"><b>${attempt === ATTEMPTS ? 'This is the FINAL draw. The selected colour becomes the question paper set for this subject and the subject will be permanently locked.' : 'The result of this attempt will be locked permanently and cannot be redone.'}</b></p>`,
      attempt === ATTEMPTS ? '🎲 Roll FINAL' : '🎲 Roll the dice', attempt === ATTEMPTS ? 'gold' : 'primary');
    if (!ok) { await appendLog('client', 'DRAW_CANCELLED', { examCode: e.code, shiftName: s.name, subject: sb.name, attempt }); return; }

    const key = dkey(examId, shiftId, subjectId, attempt);
    const D = await drawMap(examId);
    if (D.has(key)) { toast('This attempt is already locked.'); return renderClient(); }
    for (let a = 1; a < attempt; a++) if (!D.has(dkey(examId, shiftId, subjectId, a))) { toast('Previous attempts must be completed first.'); return renderClient(); }

    // ---- random selection ----
    const rnd = secureRandomInt(n), colour = sb.colours[rnd.value];
    const details = { key, examId, examName: e.name, examCode: e.code, packageVersion: e.packageVersion, shiftId, shiftName: s.name, shiftDate: s.date, window: `${s.start}-${s.end}`,
      subjectId, subjectName: sb.name, subjectCode: sb.code || '', attempt, attemptLabel: ATTEMPT_LABELS[attempt - 1], pool: sb.colours.map(c => c.name + (c.set ? ` (${c.set})` : '')), poolSize: n,
      colourIndex: rnd.value, colour, rng: 'crypto.getRandomValues Uint32 + rejection sampling', rawValue: rnd.raw, rngTries: rnd.tries, clockReading: new Date().toISOString(), networkOnline: navigator.onLine, isFinal: attempt === ATTEMPTS };
    // Persist FIRST (draw + audit entry in one atomic transaction), then animate.
    const entry = await appendLog('client', 'RANDOMIZATION_DRAW', details, { extra: en => ({ store: 'draws', value: { key, examId, shiftId, subjectId, subjectName: sb.name, attempt, colourIndex: rnd.value, colour, ts: en.ts, logSeq: en.seq, logHash: en.hash } }) });
    await animateRoll(e, s, sb, attempt, colour, entry);

    if (attempt === ATTEMPTS) {
      await appendLog('client', 'SUBJECT_FINAL_LOCKED', { examCode: e.code, shiftName: s.name, subjectName: sb.name, finalColour: colour, drawSeq: entry.seq });
      const D2 = await drawMap(examId);
      if (shiftProgress(e, s, D2).complete) {
        await appendLog('client', 'SHIFT_LOCKED', { examCode: e.code, shiftId, shiftName: s.name, finals: s.subjects.map(x => ({ subject: x.name, colour: D2.get(dkey(examId, shiftId, x.id, ATTEMPTS)).colour.name })) });
        await alertModal('Shift locked', `<p>All subjects of <b>${esc(s.name)}</b> have their final set. The shift is now permanently locked.</p><p class="muted">Please export the audit log (Audit Log tab) and store it on secure media. Results will sync to the server automatically when the PC is reconnected.</p>`);
      }
    }
  } catch (err) {
    console.error(err);
    await alertModal('Draw not recorded', `<p>${esc(err.message || err)}</p><p class="muted">No result was saved. If this attempt was already drawn it remains locked.</p>`);
  } finally { busy = false; renderClient(); }
}

function animateRoll(e, s, sb, attempt, colour, entry) {
  return new Promise(resolve => {
    const N = sb.colours.length, isFinal = attempt === ATTEMPTS;
    // Exactly 6 sets → classic Ludo cube (one face per colour). Any other count → N-sided rolling
    // prism ("long dice"), so every colour of the subject is on exactly one face.
    const useCube = N === 6;
    let shape, from, to;
    if (useCube) {
      const faces = [colour, ...sb.colours.filter(c => c !== colour).sort(() => Math.random() - .5)];
      shape = `<div class="dice">${faces.map((c, i) => faceHtml(i + 1, c)).join('')}</div>`;
      const tx = 360 * (3 + Math.floor(Math.random() * 2)), ty = 360 * (2 + Math.floor(Math.random() * 2));
      from = 'rotateX(-110deg) rotateY(150deg) rotateZ(35deg)'; to = `rotateX(${-tx}deg) rotateY(${ty}deg) rotateZ(360deg)`;
    } else {
      const R = 92, step = 360 / N, h = 2 * R * Math.sin(Math.PI / N), apo = R * Math.cos(Math.PI / N);
      const fs = Math.max(11, Math.min(22, h * 0.32));
      shape = `<div class="prism" style="--h:${h.toFixed(2)}px">${sb.colours.map((c, i) => `<div class="pface" style="--c:${c.hex};--ink:${ink(c.hex)};font-size:${fs}px;transform:rotateX(${(i * step).toFixed(3)}deg) translateZ(${apo.toFixed(2)}px)"><span>${esc(c.name)}</span>${c.set && h > 40 ? `<small>${esc(c.set)}</small>` : ''}</div>`).join('')}</div>`;
      const k = sb.colours.indexOf(colour), turns = 4 + Math.floor(Math.random() * 3);
      from = 'rotateX(0deg)'; to = `rotateX(${-(turns * 360 + k * step)}deg)`;
    }
    openModal(`<div class="roll-modal"><div class="eyebrow">${esc(e.name)} · ${esc(s.name)}</div><h3>${esc(sb.name)} — ${ATTEMPT_LABELS[attempt - 1]}</h3>
      <div class="stage"><div class="dshadow ${useCube ? '' : 'wide'}"></div><div class="hop">${shape}</div></div>
      <div class="muted sm">${useCube ? 'Ludo dice' : `${N}-sided dice`} · one face per QP set</div>
      <div class="rstatus rolling">ROLLING</div><div class="rv"></div></div>`, {
      dismissable: false,
      onMount: (m, close) => {
        const dice = m.querySelector('.dice, .prism'), hop = m.querySelector('.hop');
        dice.style.transition = 'none';
        dice.style.transform = from;
        void dice.offsetWidth;
        requestAnimationFrame(() => {
          dice.style.transition = '';
          hop.classList.add('go');
          dice.style.transform = to;
        });
        setTimeout(() => {
          const st = m.querySelector('.rstatus'); st.classList.remove('rolling'); st.textContent = isFinal ? '' : 'RESULT';
          m.querySelector('.rv').innerHTML = `${isFinal ? '<div class="finalbanner">★ FINAL QUESTION PAPER SET ★</div>' : ''}
            <div class="result ${isFinal ? 'final' : ''}" style="--c:${colour.hex}"><div class="bsw"></div><div><div class="muted sm">${isFinal ? 'Final selected set' : 'Selected set'}</div><div class="rname">${esc(colour.name)}</div><div class="muted sm">${esc(colour.set || '')}</div></div></div>
            <div class="lockline">🔒 Locked & recorded — audit entry #${entry.seq} · ${fmtTs(entry.ts)} · hash ${entry.hash.slice(0, 16)}…</div>
            <button class="btn primary" data-close>Close</button>`;
          m.querySelector('[data-close]').onclick = () => { close(); resolve(); };
          if (isFinal) confetti([colour.hex, '#c9a227', '#0b2a5b', '#e6c65a', ...sb.colours.map(c => c.hex)]);
        }, 3150);
      }
    });
  });
}

function confetti(colours) {
  const c = $('#confetti'); c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const ctx = c.getContext('2d');
  const parts = Array.from({ length: 260 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight / 2 - 60, vx: (Math.random() - .5) * 18, vy: -Math.random() * 18 - 5, s: Math.random() * 8 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colours[Math.floor(Math.random() * colours.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.strokeRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
  })(t0);
}

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  tickClock();
  if (!window.indexedDB || !window.crypto || !crypto.subtle) { app.innerHTML = '<div class="empty">This browser does not support the required secure storage/cryptography. Please use the latest Google Chrome or Microsoft Edge.</div>'; return; }
  db = await openDB();
  try { navigator.storage && navigator.storage.persist && await navigator.storage.persist(); } catch {}
  await installId();
  await renderHeader();
  if (HAS_SERVER && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (session && session.role === 'admin' && session.token) return renderAdmin();
  if (session && session.role === 'client' && await idb.get('meta', 'client_auth')) { await checkClock('reload'); const x = await verifyChain('client'); integrityIssue = x.ok ? null : x.issues[0]; renderBanners(); return renderClient(); }
  setSession(null); renderLanding();
})().catch(err => { app.innerHTML = `<div class="empty">Failed to start: ${esc(err.message)}</div>`; });
</script>
